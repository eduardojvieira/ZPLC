# The HIL trace for an image that a hardware run reads (HIL-013).
#
# Release firmware does not carry the HIL trace in its VM loop, and the board profiles no longer turn it on. An image
# for the opcode-level scripts (test_system.py and the ones like it) is built with this fragment on top of the profile:
#
#   west build -b <zephyr board> firmware/app --pristine -- -DEXTRA_CONF_FILE=<absolute path of this file>
#
# `python3 tools/hil/run_chain.py <board> --hil-trace` prints that command for the board, with the path filled in, and
# records it. The image says that the option is on in `zplc sys build --json` (options: HIL_DEBUG=y).
CONFIG_ZPLC_HIL_DEBUG=y
