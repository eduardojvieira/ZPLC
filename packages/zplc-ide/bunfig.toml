[test]
# The tests that read English text run with the system language pinned to English (UX-029): `auto` resolves from
# navigator.language, and a test must not depend on the language of the machine that runs it.
# The default timeout of a test is scaled for the system (src/test/platformTime.ts).
preload = ["./src/i18n/pinTestLanguage.ts", "./src/test/applyPlatformTime.ts"]
