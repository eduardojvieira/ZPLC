<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 200" role="img">
  <title>Sensor, PLC, actuator</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="10" y="50" width="160" height="100" rx="8" fill="#e8f0fe" stroke="#335"/>
  <text x="90" y="95" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#123">Input</text>
  <text x="90" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#123">button, sensor</text>
  <rect x="240" y="50" width="160" height="100" rx="8" fill="#fff4d6" stroke="#533"/>
  <text x="320" y="95" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#321">Program</text>
  <text x="320" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#321">the PLC decides</text>
  <rect x="470" y="50" width="160" height="100" rx="8" fill="#e3f6e8" stroke="#353"/>
  <text x="550" y="95" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="bold" fill="#132">Output</text>
  <text x="550" y="122" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#132">lamp, motor</text>
  <line x1="172" y1="100" x2="236" y2="100" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="402" y1="100" x2="466" y2="100" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="204" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">reads</text>
  <text x="434" y="85" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#333">writes</text>
</svg>
