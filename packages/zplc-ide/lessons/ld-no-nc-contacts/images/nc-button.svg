<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img">
  <title>A stop button wired normally closed: current flows at rest and stops when the button is pressed or the wire breaks</title>
  <text x="320" y="28" text-anchor="middle" font-family="sans-serif" font-size="16" font-weight="bold" fill="#222">Stop button wired normally closed</text>
  <rect x="20" y="60" width="150" height="70" rx="8" fill="#e3f6e8" stroke="#353"/>
  <text x="95" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#132">At rest</text>
  <text x="95" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#132">signal arrives: TRUE</text>
  <rect x="245" y="60" width="150" height="70" rx="8" fill="#fde8e8" stroke="#733"/>
  <text x="320" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#411">Pressed</text>
  <text x="320" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#411">circuit opens: FALSE</text>
  <rect x="470" y="60" width="150" height="70" rx="8" fill="#fde8e8" stroke="#733"/>
  <text x="545" y="90" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#411">Wire broken</text>
  <text x="545" y="112" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#411">circuit opens: FALSE</text>
  <text x="320" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">The program reads FALSE for both of the last two cases,</text>
  <text x="320" y="204" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">so a broken wire stops the machine like a press does.</text>
</svg>
