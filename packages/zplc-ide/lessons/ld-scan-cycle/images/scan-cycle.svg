<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 260" role="img">
  <title>The scan cycle: read inputs, solve rungs, write outputs</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="180" height="80" rx="8" fill="#e8f0fe" stroke="#335"/>
  <text x="110" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#123">1. Read inputs</text>
  <text x="110" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#123">take a snapshot</text>
  <rect x="230" y="20" width="180" height="80" rx="8" fill="#fff4d6" stroke="#533"/>
  <text x="320" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#321">2. Solve the rungs</text>
  <text x="320" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#321">top to bottom</text>
  <rect x="440" y="20" width="180" height="80" rx="8" fill="#e3f6e8" stroke="#353"/>
  <text x="530" y="52" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="bold" fill="#132">3. Write outputs</text>
  <text x="530" y="76" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#132">update the world</text>
  <line x1="202" y1="60" x2="226" y2="60" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="412" y1="60" x2="436" y2="60" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M530,102 L530,180 L110,180 L110,104" fill="none" stroke="#555" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="320" y="210" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#333">then it starts again, over and over</text>
</svg>
