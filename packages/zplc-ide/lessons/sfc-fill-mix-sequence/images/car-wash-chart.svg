<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 470" role="img">
  <title>A chart of three steps, WAIT, SOAP and RINSE, joined by three transitions, each step with its action</title>
  <rect width="100%" height="100%" rx="8" fill="#ffffff"/>
  <g font-family="sans-serif" fill="#123" stroke-linecap="round">
    <rect x="60" y="20" width="120" height="50" fill="#e8f0fe" stroke="#335" stroke-width="2"/>
    <rect x="66" y="26" width="108" height="38" fill="none" stroke="#335" stroke-width="1.5"/>
    <text x="120" y="51" text-anchor="middle" font-size="15" font-weight="bold">WAIT</text>
    <line x1="180" y1="45" x2="220" y2="45" stroke="#335" stroke-width="1.5"/>
    <rect x="220" y="28" width="40" height="34" fill="#fff" stroke="#335" stroke-width="1.5"/>
    <text x="240" y="50" text-anchor="middle" font-size="13">N</text>
    <rect x="260" y="28" width="330" height="34" fill="#fff" stroke="#335" stroke-width="1.5"/>
    <text x="272" y="50" font-size="13" font-family="monospace">Soap := FALSE; Water := FALSE;</text>

    <line x1="120" y1="70" x2="120" y2="150" stroke="#335" stroke-width="2"/>
    <line x1="95" y1="110" x2="145" y2="110" stroke="#533" stroke-width="4"/>
    <text x="160" y="115" font-size="13" font-family="monospace">Coin</text>

    <rect x="60" y="150" width="120" height="50" fill="#e8f0fe" stroke="#335" stroke-width="2"/>
    <text x="120" y="181" text-anchor="middle" font-size="15" font-weight="bold">SOAP</text>
    <line x1="180" y1="175" x2="220" y2="175" stroke="#335" stroke-width="1.5"/>
    <rect x="220" y="158" width="40" height="34" fill="#fff" stroke="#335" stroke-width="1.5"/>
    <text x="240" y="180" text-anchor="middle" font-size="13">N</text>
    <rect x="260" y="158" width="330" height="34" fill="#fff" stroke="#335" stroke-width="1.5"/>
    <text x="272" y="180" font-size="13" font-family="monospace">Soap := TRUE; Water := FALSE;</text>

    <line x1="120" y1="200" x2="120" y2="280" stroke="#335" stroke-width="2"/>
    <line x1="95" y1="240" x2="145" y2="240" stroke="#533" stroke-width="4"/>
    <text x="160" y="245" font-size="13" font-family="monospace">SOAP.T &gt;= T#30s</text>

    <rect x="60" y="280" width="120" height="50" fill="#e8f0fe" stroke="#335" stroke-width="2"/>
    <text x="120" y="311" text-anchor="middle" font-size="15" font-weight="bold">RINSE</text>
    <line x1="180" y1="305" x2="220" y2="305" stroke="#335" stroke-width="1.5"/>
    <rect x="220" y="288" width="40" height="34" fill="#fff" stroke="#335" stroke-width="1.5"/>
    <text x="240" y="310" text-anchor="middle" font-size="13">N</text>
    <rect x="260" y="288" width="330" height="34" fill="#fff" stroke="#335" stroke-width="1.5"/>
    <text x="272" y="310" font-size="13" font-family="monospace">Soap := FALSE; Water := TRUE;</text>

    <line x1="120" y1="330" x2="120" y2="430" stroke="#335" stroke-width="2"/>
    <line x1="95" y1="370" x2="145" y2="370" stroke="#533" stroke-width="4"/>
    <text x="160" y="375" font-size="13" font-family="monospace">RINSE.T &gt;= T#20s</text>
    <path d="M120,430 L30,430 L30,10 L120,10 L120,20" fill="none" stroke="#335" stroke-width="2"/>
    <path d="M114,12 L120,20 L126,12" fill="none" stroke="#335" stroke-width="2"/>
  </g>
</svg>
