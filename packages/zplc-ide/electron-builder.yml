# ZPLC IDE - Electron Builder Configuration
# Cross-platform builds for Windows, macOS, and Linux
#
# IMPORTANT: Architecture (x64/arm64) is controlled EXCLUSIVELY by the CLI
# flags (--x64 / --arm64) in the GitHub Actions workflow.
# Do NOT hardcode arch arrays here — it causes double builds and wastes CI time.

appId: com.zplc.ide
productName: ZPLC IDE
# executableName without spaces — rpmbuild chokes on spaces in .spec paths
executableName: zplc-ide

# Directories
directories:
  output: dist-electron
  buildResources: build

afterExtract: scripts/after-extract.mjs
afterPack: scripts/after-pack.mjs

# Files to include in the app
files:
  - dist/**/*
  - electron-dist/**/*

# Extra files to copy (icons, etc.)
extraResources:
  - from: ../../examples
    to: examples
    filter:
      - "**/*.zplc"
      - "**/*.st"
  - from: dist-native
    to: native-runtime
    filter:
      - "**/*"

# Asset Index - for faster builds
asar: true
compression: maximum

# Don't publish automatically
publish: null

# ============================================================================
# macOS Configuration
# ============================================================================
mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  darkModeSupport: true
  # No paid certificate exists, so the bundle is signed ad hoc and sealed, never notarized (REL-001, REL-003).
  # The identity is explicit: electron-builder does not fall back to ad hoc by itself.
  identity: "-"
  # The native runtime is copied by extraResources; listing it signs it with the bundle.
  binaries:
    - Contents/Resources/native-runtime/zplc_runtime
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip

dmg:
  sign: false
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ============================================================================
# Windows Configuration
# ============================================================================
win:
  icon: build/icon.png
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: "${productName}-${version}-${os}-${arch}-Setup.${ext}"
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ZPLC IDE

portable:
  artifactName: "${productName}-${version}-${os}-${arch}-Portable.${ext}"

# ============================================================================
# Linux Configuration
# ============================================================================
linux:
  category: Development
  maintainer: ZPLC Team
  syncDesktopName: true
  icon: build/icon.png
  target:
    - AppImage
    - deb
    - rpm

appImage:
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

# No `depends` override: electron-builder's defaults track current Debian, Ubuntu and Fedora (REL-011).
deb:
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"

rpm:
  artifactName: "${productName}-${version}-${os}-${arch}.${ext}"
  # Override fpm --name to avoid spaces in .spec filename
  # rpmbuild can't handle "ZPLC IDE.spec" — needs "zplc-ide.spec"
  fpm:
    - "--name"
    - "zplc-ide"
