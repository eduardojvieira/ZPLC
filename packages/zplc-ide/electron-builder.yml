# ZPLC - Electron Builder Configuration
# Cross-platform builds for Windows, macOS, and Linux
#
# IMPORTANT: Architecture (x64/arm64) is controlled EXCLUSIVELY by the CLI
# flags (--x64 / --arm64) in the GitHub Actions workflow.
# Do NOT hardcode arch arrays here — it causes double builds and wastes CI time.

# The identity of decision D-03, recorded in scripts/release/identity.json (REL-031): change them together.
appId: com.zenithindustrialcloud.zplc
productName: ZPLC
# executableName without spaces — rpmbuild chokes on spaces in .spec paths
executableName: zplc

# Directories
directories:
  output: dist-electron
  buildResources: build

afterExtract: scripts/after-extract.mjs
afterPack: scripts/after-pack.mjs
# Writes build/THIRD-PARTY-NOTICES.txt from the lockfile and the installed packages (REL-019).
beforePack: scripts/before-pack.mjs

# Files to include in the app
files:
  - dist/**/*
  - electron-dist/**/*
  # Source maps stay in the build folders for debugging and never reach an installer (IDE-015).
  - "!**/*.map"
  # The folder dialog test hook exists only in builds made for the suite (VF-008). Keep these two last: a later pattern that matches them would bring them back.
  - "!electron-dist/devFolderDialogHook.js"
  - "!electron-dist/devFolderDialogHook.js.map"

# Extra files to copy (icons, etc.)
extraResources:
  - from: ../../examples
    to: examples
    filter:
      - "**/*.zplc"
      - "**/*.st"
  - from: dist-native
    to: native-runtime
    filter:
      - "**/*"
  # The licence notices of every third-party package and font in the application (REL-019).
  - from: build/THIRD-PARTY-NOTICES.txt
    to: THIRD-PARTY-NOTICES.txt
  # The manifest of the release firmware and the images of the two learner boards, so that ZPLC shows them with no
  # network (REL-025). scripts/release/firmware-images.ts `stage` writes the folder in the release workflow; a local
  # build has none and the application then says that it holds no firmware image.
  - from: dist-firmware
    to: firmware
    filter:
      - "**/*"

# Asset Index - for faster builds
asar: true
compression: maximum

# Don't publish automatically
publish: null

# ============================================================================
# macOS Configuration
# ============================================================================
mac:
  category: public.app-category.developer-tools
  icon: ../../tools/brand/icon.icns
  darkModeSupport: true
  # REL-020: the ZIP follows the same scheme as the DMG (its default name would put the architecture before `mac`).
  artifactName: "zplc-${version}-${os}-${arch}.${ext}"
  # No paid certificate exists, so the bundle is signed ad hoc and sealed, never notarized (REL-001, REL-003).
  # The identity is explicit: electron-builder does not fall back to ad hoc by itself.
  identity: "-"
  # The native runtime is copied by extraResources; listing it signs it with the bundle.
  binaries:
    - Contents/Resources/native-runtime/zplc_runtime
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip

dmg:
  sign: false
  artifactName: "zplc-${version}-${os}-${arch}.${ext}"
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

# ============================================================================
# Windows Configuration
# ============================================================================
win:
  icon: ../../tools/brand/icon.png
  target:
    - nsis
    - portable

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # `unsigned` stays in the variant until a signed Windows channel is live (REL-038).
  artifactName: "zplc-${version}-${os}-${arch}-setup-unsigned.${ext}"
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ZPLC

portable:
  artifactName: "zplc-${version}-${os}-${arch}-portable-unsigned.${ext}"

# ============================================================================
# Linux Configuration
# ============================================================================
linux:
  category: Development
  maintainer: ZPLC Team
  syncDesktopName: true
  icon: ../../tools/brand/icon.png
  target:
    - AppImage
    - deb
    - rpm

appImage:
  artifactName: "zplc-${version}-${os}-${arch}.${ext}"

# No `depends` override: electron-builder's defaults track current Debian, Ubuntu and Fedora (REL-011).
# The udev rule (REL-013) is written by scripts/release/udev-rules.ts in the beforePack hook, from the USB identifiers of
# tools/hil/usb-ids.json, and fpm installs it in the vendor rules folder of the package: `source=destination`.
deb:
  # The package name of decision D-03 (scripts/release/identity.json): electron-builder would take the product name.
  packageName: zplc
  artifactName: "zplc-${version}-${os}-${arch}.${ext}"
  fpm:
    - "build/linux/70-zplc-boards.rules=/usr/lib/udev/rules.d/70-zplc-boards.rules"

rpm:
  packageName: zplc
  artifactName: "zplc-${version}-${os}-${arch}.${ext}"
  fpm:
    - "build/linux/70-zplc-boards.rules=/usr/lib/udev/rules.d/70-zplc-boards.rules"
