<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" width="760" height="496" role="img" aria-labelledby="wiring-rpi-pico-rp2040-title wiring-rpi-pico-rp2040-desc" font-family="sans-serif" fill="#111111" stroke="#222222" stroke-width="1.5">
<title id="wiring-rpi-pico-rp2040-title">Wiring on Raspberry Pi Pico (RP2040)</title>
<desc id="wiring-rpi-pico-rp2040-desc">Lamp: red LED with a 330 Ω resistor in series, from GP0 (header pin 1, DO0) to GND (GND · pin 38). Warning: yellow LED with a 330 Ω resistor in series, from GP1 (header pin 2, DO1) to GND (GND · pin 38). Start: push button between GP15 (header pin 20, DI0) and GND (GND · pin 38); the internal pull-up of the board reads it. Armed: jumper wire from GP14 (header pin 19, DI1) to GND (GND · pin 38); plugged in means on. Stop: push button between GP12 (header pin 16, DI3) and GND (GND · pin 38); the internal pull-up of the board reads it. Level: 10 kΩ potentiometer, ends to 3V3 (3V3(OUT) · pin 36) and GND (AGND · pin 33), wiper to GP26 (ADC0) (header pin 31, AI0).</desc>
