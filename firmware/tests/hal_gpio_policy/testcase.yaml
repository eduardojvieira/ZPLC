tests:
  zplc.hal_gpio_policy.required_missing:
    tags:
      - zplc
      - hal
      - gpio
    platform_allow:
      - native_sim/native/64
      - native_sim/native
      - qemu_cortex_m3
    integration_platforms:
      - native_sim/native/64
    harness: ztest
    timeout: 20
    extra_configs:
      - CONFIG_ZPLC_REQUIRED_GPIO_OUTPUT_MASK=0x1
  zplc.hal_gpio_policy.optional_missing:
    tags:
      - zplc
      - hal
      - gpio
    platform_allow:
      - native_sim/native/64
      - native_sim/native
      - qemu_cortex_m3
    integration_platforms:
      - native_sim/native/64
    harness: ztest
    timeout: 20
  # The next two need the GPIO emulator and the LED alias of native_sim: on a
  # board without them the HAL configures no channel and the scenarios would
  # pass or fail for a reason they do not name.
  zplc.hal_gpio_policy.partial_required:
    tags:
      - zplc
      - hal
      - gpio
    platform_allow:
      - native_sim/native/64
      - native_sim/native
    integration_platforms:
      - native_sim/native/64
    harness: ztest
    timeout: 20
    extra_configs:
      - CONFIG_ZPLC_REQUIRED_GPIO_OUTPUT_MASK=0x3
    extra_args:
      - DTC_OVERLAY_FILE=boards/native_sim_emul.overlay
  zplc.hal_gpio_policy.post_shutdown:
    tags:
      - zplc
      - hal
      - gpio
    platform_allow:
      - native_sim/native/64
      - native_sim/native
    integration_platforms:
      - native_sim/native/64
    harness: ztest
    timeout: 20
    extra_configs:
      - CONFIG_ZPLC_REQUIRED_GPIO_OUTPUT_MASK=0x1
    extra_args:
      - DTC_OVERLAY_FILE=boards/native_sim_emul.overlay
