CONFIG_ZTEST=y
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_ZPLC=y
CONFIG_ZPLC_SCHEDULER=y
CONFIG_ZPLC_MAX_TASKS=2
CONFIG_ZPLC_VM_CYCLE_INSTRUCTION_BUDGET=64
CONFIG_ZPLC_WORK_MEMORY_SIZE=2048
CONFIG_ZPLC_RETAIN_MEMORY_SIZE=1024
CONFIG_ZPLC_CODE_SIZE_MAX=8192
# Plant I/O mode lives on the device link (which needs the shell, as a build option only: no backend is started).
CONFIG_SHELL=y
CONFIG_ZPLC_DEVICE_LINK=y
CONFIG_ZPLC_PLANT_IO=y
# qemu_cortex_m3 has 64 KB of RAM: the frames of this test are small
CONFIG_ZPLC_PROTO_PAYLOAD_MAX=128
CONFIG_ZPLC_EXCHANGE_QUEUE_BYTES=256
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_ASSERT=y
