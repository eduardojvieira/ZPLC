CONFIG_ZTEST=y
CONFIG_ASSERT=y
CONFIG_ZPLC=y
CONFIG_ZPLC_SCHEDULER=y
CONFIG_ZPLC_MAX_TASKS=2
# The store keeps two programs of the code size in the 16 KB storage partition of native_sim and the suite's
# settings beside them (RT-028): the suite loads no program, so the code size is the smallest that is useful.
CONFIG_ZPLC_CODE_SIZE_MAX=4096
# The HAL references the GPIO devices of the board aliases.
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y

# The shell under test is the one of the product, on the dummy back end.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=16384
# The line of a frame of the device link at the default payload (shell_cmds.c checks it at build time).
CONFIG_SHELL_CMD_BUFF_SIZE=1280
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_METAKEYS=n
CONFIG_REBOOT=y
# A log back end of the test captures every message (COM-015); the shell does
# not interleave log lines into the output the tests compare.
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_PRINTK=y
CONFIG_HEAP_MEM_POOL_SIZE=4096
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ZTEST_STACK_SIZE=4096

# Release firmware has no raw memory command (COM-022). The diagnostic
# scenario of testcase.yaml turns this and the switch on together.
CONFIG_DEVMEM_SHELL=n

# The settings are stored through the HAL key-value store (NVS), the same
# store the program store uses; the storage partition of native_sim is the
# simulated flash.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y

# The Zephyr settings handler stays the runtime interface to the same rows.
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y
CONFIG_SETTINGS_NONE=y
CONFIG_FILE_SYSTEM=n
