# EMULATION ONLY - native_sim with the Raspberry Pi Pico channel map (tools/firmware-test/run.sh app-native).
# The Pico profile's program and memory sizes (rpi_pico_rp2040.conf, boards.json).
CONFIG_ZPLC_CODE_SIZE_MAX=24576
CONFIG_ZPLC_WORK_MEMORY_SIZE=8192
CONFIG_ZPLC_RETAIN_MEMORY_SIZE=4096

# The emulated devices behind the channel map, and the shell on its own host pty.
CONFIG_ADC=y
CONFIG_ADC_EMUL=y
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_FLASH_SIMULATOR=y
CONFIG_UART_NATIVE_PTY_0_ON_OWN_PTY=y

# `emu`: drive the emulated inputs and read the outputs from the shell (module/, native_sim only).
CONFIG_ZPLC_EMU_SHELL=y
