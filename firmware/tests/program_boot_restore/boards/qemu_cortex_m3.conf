# The ZPLC regions default to 64 KB, which is all the RAM of this board. The
# restore tests need only a small program. The store, the staging buffer and the
# resident copy each hold one program of the code size in RAM (RT-028).
CONFIG_ZTEST_STACK_SIZE=4096
CONFIG_ZPLC_WORK_MEMORY_SIZE=2048
CONFIG_ZPLC_RETAIN_MEMORY_SIZE=1024
CONFIG_ZPLC_CODE_SIZE_MAX=4096
