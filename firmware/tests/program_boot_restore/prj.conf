CONFIG_ZTEST=y
CONFIG_ZPLC=y
CONFIG_ZPLC_SCHEDULER=y
CONFIG_ZPLC_MAX_TASKS=3
# The store holds two programs of the code size and the boot path stages one more: the suite's programs are a
# few hundred bytes, and qemu_cortex_m3 has 64 KB of RAM.
CONFIG_ZPLC_CODE_SIZE_MAX=4096
# The emulated LED of native_sim is the output the restore has to put at its declared value.
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_SHELL=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_ASSERT=y
CONFIG_HEAP_MEM_POOL_SIZE=1024
