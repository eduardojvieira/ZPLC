tests:
  zplc.failsafe_reboot:
    tags:
      - zplc
      - failsafe
    platform_allow:
      - qemu_cortex_m3
    integration_platforms:
      - qemu_cortex_m3
    harness: console
    harness_config:
      type: multi_line
      ordered: true
      regex:
        - "FAILSAFE-REBOOT phase 1: a processor fault now"
        - "FAILSAFE-REBOOT phase 2: cause=fault"
        - "FAILSAFE-REBOOT phase 2: the record names a processor fault"
        - "FAILSAFE-REBOOT PASS"
    timeout: 30
