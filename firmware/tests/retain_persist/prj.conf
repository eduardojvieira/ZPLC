CONFIG_ZTEST=y
CONFIG_ZPLC=y
CONFIG_ZPLC_SCHEDULER=y
CONFIG_ZPLC_MAX_TASKS=2
CONFIG_ZPLC_VM_CYCLE_INSTRUCTION_BUDGET=64
# The HAL references the GPIO devices of the board aliases (the emulated LED of
# native_sim); without the driver the link fails.
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_SHELL=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_ASSERT=y
CONFIG_ZTEST_STACK_SIZE=4096

# The storage partition of native_sim is 16 KB of simulated flash (four 4 KB
# sectors): the RETAIN region is small so that two records fit with room for
# garbage collection.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
CONFIG_ZPLC_RETAIN_MEMORY_SIZE=512
# Two program slots of the code size must fit the 16 KB partition with the RETAIN records and a spare sector
# (the build checks it, RT-029); the suite's programs are a hundred bytes.
CONFIG_ZPLC_CODE_SIZE_MAX=2048

CONFIG_ZPLC_RETAIN_PERSIST=y

# A one second interval lets a
# test see the periodic save; the wear numbers are those of the simulated flash,
# which never wears, so the build-time budget of RT-026 passes with room.
CONFIG_ZPLC_RETAIN_SAVE_INTERVAL_S=1
CONFIG_ZPLC_RETAIN_FLASH_ENDURANCE_CYCLES=1000000000
CONFIG_ZPLC_RETAIN_FLASH_WEAR_BYTES=12288
