CONFIG_ZTEST=y
CONFIG_ZPLC=y
CONFIG_ZPLC_SCHEDULER=y
CONFIG_ZPLC_MAX_TASKS=2
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_SHELL=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_ASSERT=y
# The storage partition of native_sim is simulated flash.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
# Two program slots of this size have to fit the storage partition of native_sim (RT-029).
CONFIG_ZPLC_CODE_SIZE_MAX=4096
# The settings file system of firmware/app/src/zplc_config.c, built as the network boards build it, so that the
# suite shows it beside the NVS records on separate flash (boards/native_sim_native_64.overlay).
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
