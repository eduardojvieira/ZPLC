CONFIG_ZTEST=y
CONFIG_ZPLC=y
# The single-task configuration: no scheduler, no timers, no work queue.
CONFIG_ZPLC_SCHEDULER=n
# The emulated pins of native_sim: the scan latches the input and writes the output there.
CONFIG_GPIO=y
CONFIG_GPIO_EMUL=y
CONFIG_SHELL=n
CONFIG_LOG=n
CONFIG_PRINTK=n
CONFIG_ASSERT=y
