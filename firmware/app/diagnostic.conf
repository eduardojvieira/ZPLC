# =============================================================================
# ZPLC diagnostic image (COM-022)
# =============================================================================
# SPDX-License-Identifier: MIT
#
# Adds the commands that read and write any address of the device. Never a
# release image: build it with
#
#   west build -b <board> firmware/app -- -DEXTRA_CONF_FILE=diagnostic.conf
#
# The two lines go together; the application build stops with an error when
# only one is set (firmware/app/cmake/zplc_shell_rules.cmake).
CONFIG_ZPLC_SHELL_RAW_MEMORY=y
CONFIG_DEVMEM_SHELL=y
