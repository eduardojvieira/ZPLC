# =============================================================================
# ZPLC Zephyr Application Configuration
# =============================================================================
# SPDX-License-Identifier: MIT
# =============================================================================

# Enable the ZPLC module
CONFIG_ZPLC=y

# -----------------------------------------------------------------------------
# GPIO Configuration (Required for Phase 3 Hardware I/O)
# -----------------------------------------------------------------------------
CONFIG_GPIO=y

# -----------------------------------------------------------------------------
# ADC Configuration (Analog Input Support)
# -----------------------------------------------------------------------------
CONFIG_ADC=y

# -----------------------------------------------------------------------------
# Modbus RTU Server Support
# -----------------------------------------------------------------------------
CONFIG_MODBUS=y

# -----------------------------------------------------------------------------
# Logging Configuration
# -----------------------------------------------------------------------------
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_ZPLC_LOG_LEVEL=3

# -----------------------------------------------------------------------------
# Stack/Memory Configuration
# -----------------------------------------------------------------------------
CONFIG_MAIN_STACK_SIZE=4096

# Increase heap for boards with limited defaults
CONFIG_HEAP_MEM_POOL_SIZE=2048

# -----------------------------------------------------------------------------
# Flash & Persistence Configuration (NVS)
# -----------------------------------------------------------------------------
# Required for storing programs in Flash (non-volatile storage)
# We use NVS directly for simpler and more reliable persistence
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y

# -----------------------------------------------------------------------------
# Shell for Runtime Management (Required for Phase 3 Serial Upload)
# -----------------------------------------------------------------------------
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Shell configuration
CONFIG_SHELL_PROMPT_UART="zplc:~$ "

# The command line buffer: the longest line a client sends. That is a frame of the device link, `zplc link ` and
# the frame in hexadecimal, 2 * (CONFIG_ZPLC_PROTO_PAYLOAD_MAX + 47) + 11 characters: 1129 at the default payload of
# 512. The text commands are shorter (the longest, `zplc config set mqtt_password <511 characters>`, is 541), and
# the upload commands send 16 bytes (32 hex characters) a line. The shell drops what does not fit the buffer, and the
# build stops when a frame would not fit (shell_cmds.c). The shell keeps two buffers of this size (the line and the
# one it completes in), so every 256 bytes here cost 512 bytes of RAM. A board with a smaller payload sets less.
# Bursts are the receive ring below, not this buffer.
CONFIG_SHELL_CMD_BUFF_SIZE=1280
CONFIG_SHELL_PRINTF_BUFF_SIZE=2048

# Enable shell RX ring buffer with generous size
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=4096

# Use interrupt-driven mode for better responsiveness
CONFIG_SHELL_BACKEND_SERIAL_INTERRUPT_DRIVEN=y

# Increase stack for shell thread (needed for hex parsing)
CONFIG_SHELL_STACK_SIZE=4096

# -----------------------------------------------------------------------------
# USB CDC ACM Configuration (for boards with native USB like Pico)
# -----------------------------------------------------------------------------
# Enabled conditionally in board-specific configs (rpi_pico.conf)

# -----------------------------------------------------------------------------
# Multitask Scheduler Configuration
# -----------------------------------------------------------------------------
CONFIG_ZPLC_SCHEDULER=y
CONFIG_ZPLC_MAX_TASKS=4
CONFIG_ZPLC_SCHED_WORKQ_STACK_SIZE=2048
CONFIG_ZPLC_SCHED_WORKQ_PRIORITY=5
CONFIG_ZPLC_SCHED_HIGH_PRIO_WORKQ=y
CONFIG_ZPLC_SCHED_HIGH_PRIO_STACK_SIZE=2048
CONFIG_ZPLC_SCHED_HIGH_PRIO_PRIORITY=2

# The scan coordinator outranks every communication, logging and shell thread (RT-013). Zephyr runs its system work
# queue, which the Modbus serial server and the network management callbacks use, at a cooperative priority, and
# a cooperative thread outranks every preemptible one: it moves to the priority of the communication threads
# (CONFIG_ZPLC_COMM_THREAD_PRIORITY, 8). The network traffic threads are made preemptible in the board files.
CONFIG_SYSTEM_WORKQUEUE_PRIORITY=8

# -----------------------------------------------------------------------------
# System Reboot Support
# -----------------------------------------------------------------------------
CONFIG_REBOOT=y

# -----------------------------------------------------------------------------
# Release firmware has no raw memory command (COM-022)
# -----------------------------------------------------------------------------
# `devmem` of the Zephyr shell reads and writes any address of the device. It
# is on by default in Zephyr; the diagnostic image turns it on again with
# CONFIG_ZPLC_SHELL_RAW_MEMORY=y (diagnostic.conf), and the build stops when
# the two disagree.
CONFIG_DEVMEM_SHELL=n

# -----------------------------------------------------------------------------
