# =============================================================================
# ZPLC Board Configuration - Arduino Opta WiFi (STM32H747 M7)
# =============================================================================
# SPDX-License-Identifier: MIT
#
# Board-specific Kconfig settings for Arduino Opta WiFi (M7 core).
# =============================================================================

# Let board defaults manage USB stack to avoid UDC/DC conflicts
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y

# Persistence on the 16 MB external QSPI NOR flash, one partition per store
# (IO-008, arduino_opta_stm32h747xx_m7.overlay): the NVS records of the ZPLC HAL
# on zplc_nvs_partition (7 MB) and LittleFS, the settings file and the
# certificate files, on storage_partition (1 MB).
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/lfs/settings"
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Memory sizes
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
# The outputs this board requires are the channels of its I/O description (boards.json).

# Analog inputs are available on the board
CONFIG_ADC=y

# Networking Foundation
CONFIG_NETWORKING=y
# The network RX/TX threads are cooperative by default and would outrank the scan (RT-013).
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_L2_WIFI_MGMT=y

# IPv4
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y

# Sockets and Protocols
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

# Helper macros
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_ICMPV4_ACCEPT_BROADCAST=y
CONFIG_NET_IPV4_AUTO=n

# Random source for the network stack and for TLS (COM-016): the hardware
# random number generator of the STM32 (CONFIG_ENTROPY_STM32_RNG, from the
# board DeviceTree). CONFIG_TEST_RANDOM_GENERATOR is not set: it only permits a
# generator that is not random, and the application build stops when TLS is on
# together with it (firmware/app/cmake/zplc_tls_rng_rule.cmake).
CONFIG_ENTROPY_GENERATOR=y

# Time Synchronization
CONFIG_SNTP=y
CONFIG_POSIX_TIMERS=y
CONFIG_POSIX_API=y

# DNS Resolver
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"
CONFIG_NET_SOCKETS_DNS_TIMEOUT=3000

# Static IP fallback
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.1.200"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.1.1"
CONFIG_NET_CONFIG_INIT_TIMEOUT=5

# Disable Modbus to avoid build errors (RS-485 pins not mapped yet)
CONFIG_MODBUS=n

# MQTT + Sparkplug support, TLS OFF (COM-016).
# The random number generator of this board has not been verified on the
# board, so TLS is not built: MQTT runs over plain TCP only, and a TLS
# transport is refused by the client instead of being downgraded. Switch
# CONFIG_MQTT_LIB_TLS, CONFIG_NET_SOCKETS_SOCKOPT_TLS and CONFIG_TLS_CREDENTIALS
# back on only with a hardware record of the generator (HIL-011). mbedTLS stays
# for the SHA-256 and HMAC of the Azure SAS token.
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=n
CONFIG_MQTT_LIB_WEBSOCKET=y
CONFIG_MQTT_LIB_TLS_USE_ALPN=n
CONFIG_MQTT_VERSION_5_0=y
CONFIG_MQTT_USER_PROPERTIES_MAX=10
CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=n
CONFIG_WEBSOCKET_CLIENT=y
CONFIG_NET_SOCKETS_ENABLE_DTLS=n
CONFIG_TLS_CREDENTIALS=n
CONFIG_MBEDTLS=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=32768
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_BASE64_C=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_NANOPB=y

# -----------------------------------------------------------------------------
# RETAIN persistence (RT-025, RT-026). Engineering estimates, not measurements:
# no board was measured. See docs/docs/runtime/persistence.md for the arithmetic.
# -----------------------------------------------------------------------------
# zplc_nvs_partition: 7 MB of the external QSPI NOR (4 KB sectors assumed), rated
# 100000 erase cycles per sector, used by the NVS records alone. Wear bytes =
# 1791 * 4096 - 8300, rounded down.
# On in every shipped profile: RETAIN survives a power cycle (RT-025). The build checks the wear numbers below (RT-026).
CONFIG_ZPLC_RETAIN_PERSIST=y
CONFIG_ZPLC_RETAIN_FLASH_ENDURANCE_CYCLES=100000
CONFIG_ZPLC_RETAIN_FLASH_WEAR_BYTES=7300000
CONFIG_ZPLC_RETAIN_SAVE_INTERVAL_S=60

# -----------------------------------------------------------------------------
# Program size (RT-028, RT-029)
# -----------------------------------------------------------------------------
# The program store (its rollback scratch), the upload staging buffer and the VM each hold a program of this size
# in RAM, so the code size is three times its value in RAM. With the Wi-Fi, TLS and the network buffers of this
# profile the AXI SRAM region is 86% used at 32 KB and would overflow at the 44 KB of the other STM32 profiles.
# The IDE is told the same number by boards/boards.json (the build compares them).
CONFIG_ZPLC_CODE_SIZE_MAX=32768
