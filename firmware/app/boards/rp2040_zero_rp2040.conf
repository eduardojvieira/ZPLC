# =============================================================================
# ZPLC Board Configuration - Waveshare RP2040-Zero (rp2040_zero/rp2040)
# =============================================================================
# SPDX-License-Identifier: MIT
#
# A Kconfig fragment has no `include`: the settings the Raspberry Pi Pico profile
# shares with this board are repeated here. The board has no debugger and the
# USB port is the only host link, so the console and the shell use USB CDC ACM.
# The channels of the board are in the I/O description of
# firmware/app/boards/boards.json (waveshare-rp2040-zero).
# =============================================================================

# USB stack and CDC ACM (virtual serial port)
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="ZPLC Runtime"
CONFIG_USB_DEVICE_MANUFACTURER="ZPLC Project"
CONFIG_USB_DEVICE_VID=0x2E8A
CONFIG_USB_DEVICE_PID=0x000A
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_CDC_ACM=y

# Ring buffer for bytecode upload
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096

# Remote wakeup off, as on the Pico, to avoid suspension issues
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n

# Console and shell over USB CDC
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# HIL debugging is off in this profile, so that release firmware carries no trace in its VM loop (HIL-013).
# A HIL build adds tools/hil/hil_debug.conf with -DEXTRA_CONF_FILE=.

# The storage partition of this board is 64 KB (rp2040_zero_rp2040.overlay), the same as the Pico: the program store
# keeps two slots of the code size in it, in chunks, with a spare sector, and 24 KB is the largest round value that
# fits (RT-028, RT-029). The board manifest advertises the same size and the build compares them.
CONFIG_ZPLC_CODE_SIZE_MAX=24576

# RETAIN persistence (RT-025, RT-026). Engineering estimates, not measurements:
# the same 64 KB storage partition of the 2 MB flash as the Pico profile.
CONFIG_ZPLC_RETAIN_FLASH_ENDURANCE_CYCLES=100000
CONFIG_ZPLC_RETAIN_FLASH_WEAR_BYTES=53000
CONFIG_ZPLC_RETAIN_SAVE_INTERVAL_S=300

# -----------------------------------------------------------------------------
# Device link protocol (COM-019): bounded for the RAM of this board
# -----------------------------------------------------------------------------
# 288 bytes of payload carry the largest force (a 255-character STRING is 260 bytes and an address), and a program
# goes in chunks of 284 bytes. Each frame buffer is that and 47 bytes, in the engine, the link and the line the
# shell prints; the queue of events holds 8, 66 bytes each. The defaults (512 and 16) cost about 1.4 KB more.
CONFIG_ZPLC_PROTO_PAYLOAD_MAX=288
CONFIG_ZPLC_PROTO_EVENT_QUEUE=8

# A frame of 288 bytes of payload is a line of 681 characters (2 * (288 + 47) + 11), so the shell's line buffer is 1 KB
# here and not the 1280 bytes of the default payload (prj.conf): 512 bytes less, as it keeps two buffers of that size.
# shell_cmds.c stops the build when a frame would not fit.
CONFIG_SHELL_CMD_BUFF_SIZE=1024
