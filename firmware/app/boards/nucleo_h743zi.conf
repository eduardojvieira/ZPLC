# =============================================================================
# ZPLC Board Configuration - STM32 Nucleo-H743ZI
# =============================================================================
# SPDX-License-Identifier: MIT
#
# Board-specific Kconfig settings for the STM32 Nucleo-H743ZI.
# Use the ST-LINK VCP on USART3 for console/shell, and the internal flash for
# the image and both stores (nucleo_h743zi.overlay).
# =============================================================================

# Console / shell over ST-LINK VCP (USART3 default in upstream board DTS)
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Persistence on the internal flash, one partition per store (IO-008,
# nucleo_h743zi.overlay). The flash is erased in 128 KB sectors, above the
# 64 KB sector NVS accepts, so the records of the HAL (program, RETAIN, settings
# keys, credentials) are kept by ZMS on zplc_nvs_partition (3 sectors). LittleFS
# (the settings file and the certificate files) mounts storage_partition
# (9 sectors) and programs the flash in its 32-byte words.
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=n
CONFIG_ZMS=y
# The image links into slot0_partition (512 KB), so it cannot grow into the stores.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_LITTLEFS_PROG_SIZE=32
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/lfs/settings"

# Heap / stacks
CONFIG_HEAP_MEM_POOL_SIZE=8192
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3072
# The outputs this board requires are the channels of its I/O description (boards.json).

# Analog inputs are available on the board headers
CONFIG_ADC=y

# Ethernet networking (LAN8742 RMII path exposed by board DTS)
CONFIG_NETWORKING=y
# The network RX/TX threads are cooperative by default and would outrank the scan (RT-013).
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_ICMPV4_ACCEPT_BROADCAST=y
CONFIG_NET_IPV4_AUTO=n

# Random source for the network stack and for TLS (COM-016): the hardware
# random number generator of the STM32 (CONFIG_ENTROPY_STM32_RNG, from the
# board DeviceTree). CONFIG_TEST_RANDOM_GENERATOR is not set: it only permits a
# generator that is not random, and the application build stops when TLS is on
# together with it (firmware/app/cmake/zplc_tls_rng_rule.cmake).
CONFIG_ENTROPY_GENERATOR=y

# Time synchronization and hostname/DNS-based clients
CONFIG_SNTP=y
CONFIG_POSIX_TIMERS=y
CONFIG_POSIX_API=y
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"
CONFIG_NET_SOCKETS_DNS_TIMEOUT=3000

# Static IPv4 fallback when DHCP is unavailable
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.179.210"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.179.1"
CONFIG_NET_CONFIG_INIT_TIMEOUT=5

# MQTT + Sparkplug support, TLS OFF (COM-016).
# The random number generator of this board has not been verified on the
# board, so TLS is not built: MQTT runs over plain TCP only, and a TLS
# transport is refused by the client instead of being downgraded. Switch
# CONFIG_MQTT_LIB_TLS, CONFIG_NET_SOCKETS_SOCKOPT_TLS and CONFIG_TLS_CREDENTIALS
# back on only with a hardware record of the generator (HIL-011). mbedTLS stays
# for the SHA-256 and HMAC of the Azure SAS token.
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=n
CONFIG_MQTT_LIB_WEBSOCKET=y
CONFIG_MQTT_LIB_TLS_USE_ALPN=n
CONFIG_MQTT_VERSION_5_0=y
CONFIG_MQTT_USER_PROPERTIES_MAX=6
CONFIG_MQTT_CLEAN_SESSION=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=n
CONFIG_WEBSOCKET_CLIENT=y
CONFIG_NET_SOCKETS_ENABLE_DTLS=n
CONFIG_TLS_CREDENTIALS=n
CONFIG_MBEDTLS=y
CONFIG_PSA_WANT_ALG_SHA_256=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=16384
CONFIG_MBEDTLS_PEM_PARSE_C=y
CONFIG_MBEDTLS_BASE64_C=y
CONFIG_PSA_WANT_ALG_HMAC=y
CONFIG_PSA_WANT_KEY_TYPE_HMAC=y
CONFIG_NANOPB=y

# -----------------------------------------------------------------------------
# RETAIN persistence (RT-025, RT-026)
# -----------------------------------------------------------------------------
# Engineering estimates, not measurements: no board was measured. See
# docs/docs/runtime/persistence.md for the arithmetic.
# zplc_nvs_partition: 3 sectors of 128 KB of the internal flash, kept by ZMS,
# rated 10000 erase cycles per sector (STM32H743xI datasheet DS12110, flash
# memory endurance NEND). Wear bytes = 2 * 131072 - 8300, rounded down. A save
# interval of 600 s gives 10.8 years at a region that changes in every interval.
# On in every shipped profile: RETAIN survives a power cycle (RT-025). The build checks the wear numbers below (RT-026).
CONFIG_ZPLC_RETAIN_PERSIST=y
CONFIG_ZPLC_RETAIN_FLASH_ENDURANCE_CYCLES=10000
CONFIG_ZPLC_RETAIN_FLASH_WEAR_BYTES=253000
CONFIG_ZPLC_RETAIN_SAVE_INTERVAL_S=600
