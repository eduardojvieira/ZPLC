# =============================================================================
# ZPLC Board Configuration - Raspberry Pi Pico (RP2040)
# =============================================================================
# SPDX-License-Identifier: MIT
#
# This enables USB CDC ACM for serial communication over the native USB port.
# The Pico doesn't have a built-in debugger, so we use USB CDC for the shell.
# =============================================================================

# -----------------------------------------------------------------------------
# USB Stack Configuration
# -----------------------------------------------------------------------------
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="ZPLC Runtime"
CONFIG_USB_DEVICE_MANUFACTURER="ZPLC Project"
CONFIG_USB_DEVICE_VID=0x2E8A
CONFIG_USB_DEVICE_PID=0x000A
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# -----------------------------------------------------------------------------
# USB CDC ACM (Virtual Serial Port)
# -----------------------------------------------------------------------------
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_CDC_ACM=y

# Increase ring buffer for bytecode upload
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096

# Disable remote wakeup to prevent suspension issues
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n

# -----------------------------------------------------------------------------
# Modbus RTU on UART1, GP4 (TX) and GP5 (RX): the zephyr,modbus-serial node of the overlay (COM-012, HIL-010).
# UART0 (GP0, GP1) is disabled there because its pins are DO0 and DO1.
# -----------------------------------------------------------------------------
CONFIG_MODBUS_SERIAL=y

# -----------------------------------------------------------------------------
# Console & Shell over USB CDC
# -----------------------------------------------------------------------------
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# -----------------------------------------------------------------------------
# HIL Debugging is off in this profile, so that release firmware carries no trace in its VM loop (HIL-013).
# A HIL build adds tools/hil/hil_debug.conf with -DEXTRA_CONF_FILE=.
# -----------------------------------------------------------------------------
# The outputs this board requires are the channels of its I/O description (boards.json).

# The storage partition of this board is 128 KB (rpi_pico_rp2040.overlay). The program store keeps two slots of the
# code size in it, in chunks, with the two RETAIN records and a spare sector (RT-028, RT-029): 64 KB held the slots
# of 24 KB but not the RETAIN records as well. The build fails if they do not fit, and the IDE and the shell
# advertise this size.
CONFIG_ZPLC_CODE_SIZE_MAX=24576

# -----------------------------------------------------------------------------
# RETAIN persistence (RT-025, RT-026). Engineering estimates, not measurements:
# no board was measured. See docs/docs/runtime/persistence.md for the arithmetic.
# -----------------------------------------------------------------------------
# storage_partition: 128 KB of the on-board QSPI NOR (32 sectors of 4 KB), rated
# 100000 erase cycles per sector (W25Q16 class). Wear bytes = 31 * 4096, less the
# live data garbage collection copies: the two program slots of 24 KB (about
# 54700 bytes with their chunk overhead) and the other RETAIN record (about 4500),
# rounded down. 4 KB RETAIN, 4448 bytes a save, worst case 300 s -> 14.3 years.
# On in every shipped profile: RETAIN survives a power cycle (RT-025). The build checks the wear numbers below (RT-026).
CONFIG_ZPLC_RETAIN_PERSIST=y
CONFIG_ZPLC_RETAIN_FLASH_ENDURANCE_CYCLES=100000
CONFIG_ZPLC_RETAIN_FLASH_WEAR_BYTES=67000
CONFIG_ZPLC_RETAIN_SAVE_INTERVAL_S=300

# -----------------------------------------------------------------------------
# Device link protocol (COM-019): bounded for the RAM of this board
# -----------------------------------------------------------------------------
# 288 bytes of payload carry the largest force (a 255-character STRING is 260 bytes and an address), and a program
# goes in chunks of 284 bytes. Each frame buffer is that and 47 bytes, in the engine, the link and the line the
# shell prints; the queue of events holds 8, 66 bytes each. The defaults (512 and 16) cost about 1.4 KB more.
CONFIG_ZPLC_PROTO_PAYLOAD_MAX=288
CONFIG_ZPLC_PROTO_EVENT_QUEUE=8

# A frame of 288 bytes of payload is a line of 681 characters (2 * (288 + 47) + 11), so the shell's line buffer is 1 KB
# here and not the 1280 bytes of the default payload (prj.conf): 512 bytes less, as it keeps two buffers of that size.
# shell_cmds.c stops the build when a frame would not fit.
CONFIG_SHELL_CMD_BUFF_SIZE=1024
