# =============================================================================
# ZPLC Board Configuration - Raspberry Pi Pico (RP2040)
# =============================================================================
# SPDX-License-Identifier: MIT
#
# This enables USB CDC ACM for serial communication over the native USB port.
# The Pico doesn't have a built-in debugger, so we use USB CDC for the shell.
# =============================================================================

# -----------------------------------------------------------------------------
# USB Stack Configuration
# -----------------------------------------------------------------------------
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="ZPLC Runtime"
CONFIG_USB_DEVICE_MANUFACTURER="ZPLC Project"
CONFIG_USB_DEVICE_VID=0x2E8A
CONFIG_USB_DEVICE_PID=0x000A
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y

# -----------------------------------------------------------------------------
# USB CDC ACM (Virtual Serial Port)
# -----------------------------------------------------------------------------
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_CDC_ACM=y

# Increase ring buffer for bytecode upload
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=4096

# Disable remote wakeup to prevent suspension issues
CONFIG_USB_DEVICE_REMOTE_WAKEUP=n

# -----------------------------------------------------------------------------
# Console & Shell over USB CDC
# -----------------------------------------------------------------------------
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# -----------------------------------------------------------------------------
# HIL Debugging
# -----------------------------------------------------------------------------
CONFIG_ZPLC_HIL_DEBUG=y
# The outputs this board requires are the channels of its I/O description (boards.json).

# -----------------------------------------------------------------------------
# RETAIN persistence (RT-025, RT-026). Engineering estimates, not measurements:
# no board was measured. See docs/docs/runtime/persistence.md for the arithmetic.
# -----------------------------------------------------------------------------
# storage_partition: 64 KB of the on-board QSPI NOR (16 sectors of 4 KB), rated
# 100000 erase cycles per sector (W25Q16 class). Wear bytes = 15 * 4096 - 8300
# (the program slots), rounded down. 4 KB RETAIN, worst case 300 s -> 11.3 years.
CONFIG_ZPLC_RETAIN_FLASH_ENDURANCE_CYCLES=100000
CONFIG_ZPLC_RETAIN_FLASH_WEAR_BYTES=53000
CONFIG_ZPLC_RETAIN_SAVE_INTERVAL_S=300
