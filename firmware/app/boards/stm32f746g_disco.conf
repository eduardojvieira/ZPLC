# =============================================================================
# ZPLC Board Configuration - STM32F746G Discovery
# =============================================================================
# SPDX-License-Identifier: MIT
#
# Board-specific Kconfig settings for the STM32F746G-DISCO.
# These override or extend the base prj.conf settings.
# =============================================================================

# ST-LINK VCP is kept on USART1 for console/shell.
# Production-style Modbus RTU uses USART6 on the Arduino header.
CONFIG_UART_INTERRUPT_DRIVEN=y

# Persistence on the external QSPI NOR flash, one partition per store (IO-008,
# stm32f746g_disco.overlay): the NVS records of the ZPLC HAL (program, RETAIN,
# settings keys, credentials) on zplc_nvs_partition (15 MB), and LittleFS, the
# settings file of CONFIG_SETTINGS_FILE and the certificate files, on
# storage_partition (640 KB). The internal flash cannot hold NVS: its sectors
# are 32 KB and 256 KB, and NVS refuses a sector above 64 KB.
# The filesystem is mounted by zplc_config_init() before settings_subsys_init().
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/lfs/settings"
# LittleFS needs a heap for internal allocation
CONFIG_HEAP_MEM_POOL_SIZE=8192

# Memory sizes (F746 has more resources)
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
# The outputs this board requires are the channels of its I/O description (boards.json).

# Enable ADC for analog inputs
CONFIG_ADC=y

# =============================================================================
# Networking Foundation (Phase 1.4.1)
# =============================================================================
CONFIG_NETWORKING=y
# The network RX/TX threads are cooperative by default and would outrank the scan (RT-013).
CONFIG_NET_TC_THREAD_PREEMPTIVE=y
CONFIG_NET_L2_ETHERNET=y

# IPv4
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y

# Sockets
CONFIG_NET_SOCKETS=y

# Protocols
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y

# Helper macros
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

# Ping response
CONFIG_NET_ICMPV4_ACCEPT_BROADCAST=y

# DISABLE link-local/APIPA fallback (RFC 3927).
# With NET_IPV4_AUTO=y, when DHCP fails Zephyr falls back to a 169.254.x.x
# address which has no default gateway — breaking all external connectivity.
# We use NET_CONFIG_SETTINGS for a static fallback IP instead.
CONFIG_NET_IPV4_AUTO=n

# Random MAC address generation
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Time Synchronization
CONFIG_SNTP=y
CONFIG_POSIX_TIMERS=y
CONFIG_POSIX_API=y

# DNS Resolver (Required for MQTT broker resolution)
CONFIG_DNS_RESOLVER=y
CONFIG_DNS_SERVER_IP_ADDRESSES=y
CONFIG_DNS_SERVER1="8.8.8.8"
CONFIG_NET_SOCKETS_DNS_TIMEOUT=3000

# Static IP fallback via net_config subsystem.
#
# NET_CONFIG_NEED_IPV4 activates the auto_init path in net_config/init.c,
# which sets the static address as NET_ADDR_OVERRIDABLE and registers the
# DHCP event callback. If DHCP succeeds it overrides the static IP; if it
# fails (or is absent) the static address is used as-is.
#
# Without NET_CONFIG_NEED_IPV4, the NET_CONFIG_MY_IPV4_ADDR string is
# compiled in but the net_config init path is never triggered, so the
# static address is never assigned to the interface.
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_NET_CONFIG_NEED_IPV4=y
CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.179.200"
CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.179.1"
CONFIG_NET_CONFIG_INIT_TIMEOUT=5

# Keep the F746 profile Ethernet + Modbus focused.
# Full MQTT/TLS/Sparkplug pushes this MCU beyond RAM limits in the current app.
CONFIG_MQTT_LIB=n
CONFIG_MQTT_LIB_TLS=n
CONFIG_MQTT_LIB_WEBSOCKET=n
CONFIG_MQTT_LIB_TLS_USE_ALPN=n
CONFIG_MQTT_VERSION_5_0=n
CONFIG_NET_SOCKETS_SOCKOPT_TLS=n
CONFIG_WEBSOCKET_CLIENT=n
CONFIG_NET_SOCKETS_ENABLE_DTLS=n
CONFIG_TLS_CREDENTIALS=n
CONFIG_MBEDTLS=n
CONFIG_MBEDTLS_ENABLE_HEAP=n
CONFIG_NANOPB=n

# -----------------------------------------------------------------------------
# RETAIN persistence (RT-025, RT-026). Engineering estimates, not measurements:
# no board was measured. See docs/docs/runtime/persistence.md for the arithmetic.
# -----------------------------------------------------------------------------
# zplc_nvs_partition: 15 MB of the external QSPI NOR (4 KB sub-sectors assumed),
# rated 100000 erase cycles per sector, used by the NVS records alone (the
# settings file system has storage_partition). Wear bytes = 3839 * 4096 - 8300,
# rounded down.
CONFIG_ZPLC_RETAIN_FLASH_ENDURANCE_CYCLES=100000
CONFIG_ZPLC_RETAIN_FLASH_WEAR_BYTES=15700000
CONFIG_ZPLC_RETAIN_SAVE_INTERVAL_S=60

# -----------------------------------------------------------------------------
# Program size (RT-028, RT-029)
# -----------------------------------------------------------------------------
# The program store (its rollback scratch), the upload staging buffer and the VM each hold a program of this size
# in RAM, so the code size is three times its value in RAM. With the network and the LittleFS buffers of this
# profile the 256 KB of SRAM are 85% used at 16 KB and do not hold the 44 KB of the other STM32 profiles. The IDE
# is told the same number by boards/boards.json (the build compares them).
CONFIG_ZPLC_CODE_SIZE_MAX=16384
