name: ZPLC CI

on:
  push:
    branches: [main, master, zplc-2.0-candidate]
  pull_request:
    branches: [main, master, zplc-2.0-candidate]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          test -f bun.lock
          bun install --frozen-lockfile

      - name: Test CI tooling
        run: bun test ./tools/ci

      - name: Check the requirement index and its evidence record
        run: |
          bun tools/ci/generate-requirement-index.ts --check
          bun tools/ci/requirement-coverage.ts --check

      - name: Validate canonical product version
        run: bun run check:versions

      - name: Test release version helpers
        run: bun test scripts/release-version.test.ts

      - name: Test release integrity bundle
        run: node --test scripts/release-artifacts.test.mjs

      - name: Verify workflow action pins
        run: node --test scripts/workflow-action-pins.test.mjs

      - name: Build and test compiler
        run: |
          bun run build:compiler
          status=0
          bun run test:compiler -- --reporter=junit --reporter-outfile="${RUNNER_TEMP}/junit-compiler.xml" || status=$?
          bun tools/ci/check-expected-failures.ts --exit-code "${status}" "packages/zplc-compiler=${RUNNER_TEMP}/junit-compiler.xml"

      - name: Verify standalone CLI version
        run: |
          bun build --compile --minify --target bun-linux-x64 \
            packages/zplc-ide/src/cli/index.ts \
            --outfile "${RUNNER_TEMP}/zplc-cli"
          expected=$(bun -e "console.log(require('./package.json').version)")
          actual=$(cd "${RUNNER_TEMP}" && ./zplc-cli --version)
          test "${actual}" = "zplc-cli ${expected}"

      - name: Typecheck every TypeScript program
        run: bun run typecheck

      - name: Build native POSIX simulator for IDE scenarios
        run: |
          cmake -S firmware/lib/zplc_core -B "${RUNNER_TEMP}/zplc-native-sim-build"
          cmake --build "${RUNNER_TEMP}/zplc-native-sim-build" --target zplc_runtime --parallel

      - name: Build, test, and lint IDE
        env:
          ZPLC_NATIVE_SIM_BIN: ${{ runner.temp }}/zplc-native-sim-build/zplc_runtime
        run: |
          test -x "$ZPLC_NATIVE_SIM_BIN"
          bun run build:ide
          status=0
          bun run test:ide -- --reporter=junit --reporter-outfile="${RUNNER_TEMP}/junit-ide.xml" || status=$?
          bun tools/ci/check-expected-failures.ts --exit-code "${status}" "packages/zplc-ide=${RUNNER_TEMP}/junit-ide.xml"
          bun run lint:ide

      - name: Smoke Studio renderer vertical
        env:
          ZPLC_NATIVE_SIM_BIN: ${{ runner.temp }}/zplc-native-sim-build/zplc_runtime
        run: |
          test -x "$ZPLC_NATIVE_SIM_BIN"
          bun run --cwd packages/zplc-ide smoke:studio-vertical

      - name: Install Electron smoke display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          command -v xvfb-run

      - name: Compile Electron development host
        env:
          ZPLC_NATIVE_SIM_BIN: ${{ runner.temp }}/zplc-native-sim-build/zplc_runtime
        run: |
          test -x "$ZPLC_NATIVE_SIM_BIN"
          bun run --cwd packages/zplc-ide electron:compile

      - name: Prepare development Electron sandbox
        working-directory: packages/zplc-ide
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t sandboxes < <(find node_modules/electron/dist -type f -name chrome-sandbox -print)
          [ "${#sandboxes[@]}" -eq 1 ] || { echo "Expected exactly one development chrome-sandbox, found ${#sandboxes[@]}"; exit 1; }
          sandbox="${sandboxes[0]}"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          [ "$(stat -c '%U:%G:%a' "$sandbox")" = 'root:root:4755' ] || { echo "Incorrect chrome-sandbox ownership or mode"; stat -c '%U:%G:%a %n' "$sandbox"; exit 1; }

      - name: Smoke Electron development host vertical
        env:
          ZPLC_NATIVE_SIM_BIN: ${{ runner.temp }}/zplc-native-sim-build/zplc_runtime
        run: |
          test -x "$ZPLC_NATIVE_SIM_BIN"
          xvfb-run --auto-servernum bun run --cwd packages/zplc-ide smoke:desktop

  host-core:
    name: C99 host core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Configure host core
        run: cmake -S firmware/lib/zplc_core -B "${{ runner.temp }}/zplc-core-build"

      - name: Build host core
        run: cmake --build "${{ runner.temp }}/zplc-core-build" --parallel

      - name: Test host core
        run: ctest --test-dir "${{ runner.temp }}/zplc-core-build" --output-on-failure

  host-core-sanitized:
    name: C99 host core (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Configure sanitized host core
        run: >-
          cmake -S firmware/lib/zplc_core -B "${{ runner.temp }}/zplc-core-sanitized-build"
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=undefined,float-cast-overflow -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build sanitized host core
        run: cmake --build "${{ runner.temp }}/zplc-core-sanitized-build" --parallel

      - name: Test sanitized host core
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir "${{ runner.temp }}/zplc-core-sanitized-build" --output-on-failure

      # VF-018: clang-tidy with the repository's .clang-tidy, every finding an error, over the core, the POSIX HAL and
      # the host application (a CMake compile database of firmware/lib/zplc_core, nothing is built for it). The Zephyr
      # HAL and firmware/app are analysed where a west build tree exists: tools/firmware-test/run.sh tidy.
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-tidy

      - name: Static analysis (clang-tidy, warnings are errors)
        run: |
          python3 tools/ci/test_run_clang_tidy.py
          python3 tools/ci/run_clang_tidy.py

      # VF-014: the loader fuzzer (mutations keep the CRC valid) and the run fuzzer (accepted artifacts are
      # executed under the sanitizers) for 60 seconds each, in parallel. A finding fails the job and its
      # reproducer is printed in the log (base64). The long run is proposed in tools/fuzz/nightly-fuzz.proposed.yml.
      - name: Fuzz loader verification and artifact execution (short)
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
          ZPLC_FUZZ_WORK: ${{ runner.temp }}/zplc-fuzz
          ZPLC_FUZZ_ARTIFACTS: ${{ runner.temp }}/zplc-fuzz-artifacts
        run: tools/fuzz/run.sh 60 both

  zephyr-twister:
    name: Zephyr Twister (native_sim/native/64)
    runs-on: ubuntu-latest
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          path: zplc

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Test the firmware test report tool
        run: python3 zplc/tools/firmware-test/test_fwtest.py

      - name: Setup pinned Zephyr workspace
        shell: bash
        env:
          ZPLC_WEST_SDK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZEPHYR_SDK_INSTALL_DIR="${RUNNER_TEMP}/zephyr-sdk-1.0.1"
          echo "ZEPHYR_SDK_INSTALL_DIR=${ZEPHYR_SDK_INSTALL_DIR}" >> "${GITHUB_ENV}"
          VENV_DIR="${RUNNER_TEMP}/zplc-zephyr-venv"
          python3 -m venv "${VENV_DIR}"
          "${VENV_DIR}/bin/pip" install west==1.5.0
          "${VENV_DIR}/bin/west" init -l "${GITHUB_WORKSPACE}/zplc"
          "${VENV_DIR}/bin/west" update
          test "$(git -C "${GITHUB_WORKSPACE}/zephyr" rev-parse HEAD)" = "dccb09599635bdff17633fa7e9dab014b91dce90"
          "${VENV_DIR}/bin/west" zephyr-export
          "${VENV_DIR}/bin/west" packages pip --install --ignore-venv-check
          "${VENV_DIR}/bin/west" sdk install --version 1.0.1 --install-dir "${ZEPHYR_SDK_INSTALL_DIR}" --gnu-toolchains arm-zephyr-eabi xtensa-espressif_esp32s3_zephyr-elf --personal-access-token "${ZPLC_WEST_SDK_GITHUB_TOKEN}"
          test -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/arm-zephyr-eabi"
          test -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/xtensa-espressif_esp32s3_zephyr-elf"
          echo "${VENV_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Run Twister
        run: west twister -T zplc/firmware/tests -p native_sim/native/64 --inline-logs --outdir "${RUNNER_TEMP}/zplc-twister"

      - name: Install the 32-bit C runtime for native_sim/native
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-multilib

      - name: Run Twister on 32-bit native_sim and QEMU (Cortex-M3, Cortex-M0)
        env:
          ZPLC_FW_WS: ${{ github.workspace }}
        run: zplc/tools/firmware-test/run.sh native32 qemu-m3 qemu-m0

  zephyr-cross-build:
    name: Zephyr cross-build (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: rpi-pico
            board: rpi_pico/rp2040
          - id: arduino-giga-r1
            board: arduino_giga_r1/stm32h747xx/m7
          - id: esp32s3-devkitc
            board: esp32s3_devkitc/esp32s3/procpu
          - id: stm32f746g-disco
            board: stm32f746g_disco/stm32f746xx
          - id: nucleo-h743zi
            board: nucleo_h743zi/stm32h743xx
          - id: arduino-opta
            board: arduino_opta/stm32h747xx/m7
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          path: zplc

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup pinned Zephyr workspace
        shell: bash
        env:
          ZPLC_WEST_SDK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZEPHYR_SDK_INSTALL_DIR="${RUNNER_TEMP}/zephyr-sdk-1.0.1"
          echo "ZEPHYR_SDK_INSTALL_DIR=${ZEPHYR_SDK_INSTALL_DIR}" >> "${GITHUB_ENV}"
          VENV_DIR="${RUNNER_TEMP}/zplc-zephyr-venv"
          python3 -m venv "${VENV_DIR}"
          "${VENV_DIR}/bin/pip" install west==1.5.0
          "${VENV_DIR}/bin/west" init -l "${GITHUB_WORKSPACE}/zplc"
          "${VENV_DIR}/bin/west" update
          test "$(git -C "${GITHUB_WORKSPACE}/zephyr" rev-parse HEAD)" = "dccb09599635bdff17633fa7e9dab014b91dce90"
          "${VENV_DIR}/bin/west" zephyr-export
          "${VENV_DIR}/bin/west" packages pip --install --ignore-venv-check
          "${VENV_DIR}/bin/west" sdk install --version 1.0.1 --install-dir "${ZEPHYR_SDK_INSTALL_DIR}" --gnu-toolchains arm-zephyr-eabi xtensa-espressif_esp32s3_zephyr-elf --personal-access-token "${ZPLC_WEST_SDK_GITHUB_TOKEN}"
          test -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/arm-zephyr-eabi"
          test -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/xtensa-espressif_esp32s3_zephyr-elf"
          echo "${VENV_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Fetch ESP32 HAL blobs
        if: matrix.id == 'esp32s3-devkitc'
        run: west blobs fetch hal_espressif

      - name: Cross-build firmware app
        shell: bash
        run: |
          set -o pipefail
          west build -p always -b "${{ matrix.board }}" zplc/firmware/app -d "${RUNNER_TEMP}/zplc-${{ matrix.id }}" 2>&1 | tee "${RUNNER_TEMP}/zplc-${{ matrix.id }}.build.log"

      - name: Check flash and RAM against the size budget
        shell: bash
        run: |
          status=0
          python3 zplc/tools/firmware-test/fwtest.py size \
            --budget zplc/tools/firmware-test/size-budget.json \
            --log "${RUNNER_TEMP}/zplc-${{ matrix.id }}.build.log" \
            --zephyr-board "${{ matrix.board }}" > "${RUNNER_TEMP}/size-${{ matrix.id }}.txt" || status=$?
          cat "${RUNNER_TEMP}/size-${{ matrix.id }}.txt"
          {
            echo '### Flash and RAM: ${{ matrix.id }}'
            echo '```text'
            cat "${RUNNER_TEMP}/size-${{ matrix.id }}.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Keep cross-build firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-${{ matrix.id }}
          path: ${{ runner.temp }}/zplc-${{ matrix.id }}/zephyr/zephyr.*
          if-no-files-found: error

  docs-and-truth:
    name: Docs and truth sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          test -f bun.lock
          bun install --frozen-lockfile

      - name: Validate repository truth sources
        run: |
          python3 tools/hil/audit_repo_hygiene.py
          python3 tools/hil/audit_specs_scope.py
          python3 tools/hil/validate_release_evidence.py
          python3 tools/hil/validate_supported_boards.py
          python3 tools/hil/test_validate_supported_boards.py
          python3 tools/hil/test_validate_release_evidence.py
          python3 tools/docs/test_validate_docs_pages.py
          python3 tools/docs/validate_docs_pages.py
          python3 tools/docs/test_generate_known_limits.py
          python3 tools/docs/generate_known_limits.py --check
          bun tools/ci/test-inventory.ts
          bun tools/ci/test-source-guard.ts

      - name: Check the generated binary contract
        run: bun run contract:check

      - name: Generate and validate documentation references
        run: |
          bun run docs:generate
          bun run docs:validate
          git diff --exit-code -- \
            docs/docs/reference/runtime-api.md \
            docs/docs/reference/boards.md \
            docs/docs/languages/st.md \
            docs/docs/runtime/stdlib.md \
            docs/i18n/es/docusaurus-plugin-content-docs/current/reference/runtime-api.md \
            docs/i18n/es/docusaurus-plugin-content-docs/current/reference/boards.md \
            docs/i18n/es/docusaurus-plugin-content-docs/current/languages/st.md \
            docs/i18n/es/docusaurus-plugin-content-docs/current/runtime/stdlib.md
          bun run docs:build
