name: ZPLC CI

on:
  push:
    branches: [main, master, zplc-2.0-candidate]
  pull_request:
    branches: [main, master, zplc-2.0-candidate]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  typescript:
    name: TypeScript packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          test -f bun.lock
          bun install --frozen-lockfile

      - name: Test CI tooling
        run: bun test ./tools/ci

      - name: Test documentation tooling
        run: bun test ./tools/docs

      - name: Check the requirement index and its evidence record
        run: |
          bun tools/ci/generate-requirement-index.ts --check
          bun tools/ci/requirement-coverage.ts --check

      - name: Validate canonical product version
        run: bun run check:versions

      - name: Test release version helpers
        run: bun test scripts/release-version.test.ts

      - name: Test release integrity bundle
        run: node --test scripts/release-artifacts.test.mjs

      - name: Verify workflow action pins
        run: node --test scripts/workflow-action-pins.test.mjs

      - name: Build and test compiler
        run: |
          bun run build:compiler
          status=0
          bun run test:compiler -- --reporter=junit --reporter-outfile="${RUNNER_TEMP}/junit-compiler.xml" || status=$?
          bun tools/ci/check-expected-failures.ts --exit-code "${status}" "packages/zplc-compiler=${RUNNER_TEMP}/junit-compiler.xml"

      # The release notes list the suites a run executed with their counts (REL-027): the reports are kept for it.
      - name: Keep the compiler test report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-compiler
          path: ${{ runner.temp }}/junit-compiler.xml
          if-no-files-found: ignore
          retention-days: 7

      # REL-018: the bill of materials is generated from the lockfile; the check fails when the document would hold
      # fewer packages than the lockfile lists or than the recorded floor.
      - name: Check the software bill of materials
        run: bun scripts/release/sbom.ts --check

      # REL-026: the CLI and the MCP server are built as standalone executables and run from a folder with no
      # checkout (version, a compile of a bundled project, the list of MCP tools). The tests of the release
      # scripts need the compiler package built, so they run here and not before it.
      - name: Test release tooling and smoke the standalone CLI and MCP server
        run: |
          bun test ./scripts/release
          bun scripts/release/binaries.ts --targets host --out "${RUNNER_TEMP}/zplc-bin" --smoke

      - name: Typecheck every TypeScript program
        run: bun run typecheck

      # IDE-025: tools/wasm-core builds the core of the runtime as WebAssembly with clang and wasm-ld, and the IDE tests run the
      # conformance cases on it with the loader's verifier. Without the tools those tests fail here; they never skip.
      - name: Install the WebAssembly toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld

      - name: Build native POSIX simulator for IDE scenarios
        run: |
          cmake -S firmware/lib/zplc_core -B "${RUNNER_TEMP}/zplc-native-sim-build"
          cmake --build "${RUNNER_TEMP}/zplc-native-sim-build" --target zplc_runtime --parallel

      # HIL-001, HIL-004, HIL-007, HIL-008, HIL-009, HIL-012, HIL-017: the Python tests of tools/hil (every device script
      # exits non-zero when a check fails, the chain command and the run record, the CRC32 cross check of the C loader
      # and the TypeScript assembler) and the tests of packages/zplc-hil run on fake devices and on the native runtime.
      # They open no serial port and are not hardware evidence.
      - name: Test the HIL tools and the HIL package
        env:
          ZPLC_NATIVE_SIM_BIN: ${{ runner.temp }}/zplc-native-sim-build/zplc_runtime
        run: |
          test -x "$ZPLC_NATIVE_SIM_BIN"
          python3 -B -m unittest discover -s tools/hil -p 'test_hil_*.py'
          python3 -B tools/test_crc32_cross.py
          bun test packages/zplc-hil

      - name: Build, test, and lint IDE
        env:
          ZPLC_NATIVE_SIM_BIN: ${{ runner.temp }}/zplc-native-sim-build/zplc_runtime
        run: |
          test -x "$ZPLC_NATIVE_SIM_BIN"
          bun run build:ide
          status=0
          bun run test:ide -- --reporter=junit --reporter-outfile="${RUNNER_TEMP}/junit-ide.xml" || status=$?
          bun tools/ci/check-expected-failures.ts --exit-code "${status}" "packages/zplc-ide=${RUNNER_TEMP}/junit-ide.xml"
          bun run lint:ide

      - name: Keep the Studio test report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: junit-ide
          path: ${{ runner.temp }}/junit-ide.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Smoke Studio renderer vertical
        env:
          ZPLC_NATIVE_SIM_BIN: ${{ runner.temp }}/zplc-native-sim-build/zplc_runtime
        run: |
          test -x "$ZPLC_NATIVE_SIM_BIN"
          bun run --cwd packages/zplc-ide smoke:studio-vertical

      - name: Install Electron smoke display
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          command -v xvfb-run

      - name: Compile Electron development host
        env:
          ZPLC_NATIVE_SIM_BIN: ${{ runner.temp }}/zplc-native-sim-build/zplc_runtime
        run: |
          test -x "$ZPLC_NATIVE_SIM_BIN"
          bun run --cwd packages/zplc-ide electron:compile

      - name: Prepare development Electron sandbox
        working-directory: packages/zplc-ide
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t sandboxes < <(find node_modules/electron/dist -type f -name chrome-sandbox -print)
          [ "${#sandboxes[@]}" -eq 1 ] || { echo "Expected exactly one development chrome-sandbox, found ${#sandboxes[@]}"; exit 1; }
          sandbox="${sandboxes[0]}"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          [ "$(stat -c '%U:%G:%a' "$sandbox")" = 'root:root:4755' ] || { echo "Incorrect chrome-sandbox ownership or mode"; stat -c '%U:%G:%a %n' "$sandbox"; exit 1; }

      - name: Smoke Electron development host vertical
        env:
          ZPLC_NATIVE_SIM_BIN: ${{ runner.temp }}/zplc-native-sim-build/zplc_runtime
        run: |
          test -x "$ZPLC_NATIVE_SIM_BIN"
          xvfb-run --auto-servernum bun run --cwd packages/zplc-ide smoke:desktop

      # VF-008, VF-009: the journeys drive the real Electron development host on a temporary folder, through input
      # events only. A journey that fails, or a listed known gap that now passes, fails the job. The same run is made
      # on macOS and Windows by nightly-quality.yml.
      - name: Run the end-to-end journeys
        env:
          ZPLC_NATIVE_SIM_BIN: ${{ runner.temp }}/zplc-native-sim-build/zplc_runtime
        run: |
          test -x "$ZPLC_NATIVE_SIM_BIN"
          xvfb-run --auto-servernum bun run --cwd packages/zplc-ide smoke:journeys

  host-core:
    name: C99 host core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Configure host core
        run: cmake -S firmware/lib/zplc_core -B "${{ runner.temp }}/zplc-core-build"

      - name: Build host core
        run: cmake --build "${{ runner.temp }}/zplc-core-build" --parallel

      - name: Test host core
        run: ctest --test-dir "${{ runner.temp }}/zplc-core-build" --output-on-failure

  host-core-sanitized:
    name: C99 host core (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Configure sanitized host core
        run: >-
          cmake -S firmware/lib/zplc_core -B "${{ runner.temp }}/zplc-core-sanitized-build"
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined,float-cast-overflow -fno-sanitize-recover=undefined,float-cast-overflow -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"

      - name: Build sanitized host core
        run: cmake --build "${{ runner.temp }}/zplc-core-sanitized-build" --parallel

      - name: Test sanitized host core
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: ctest --test-dir "${{ runner.temp }}/zplc-core-sanitized-build" --output-on-failure

      # VF-018: clang-tidy with the repository's .clang-tidy, every finding an error, over the core, the POSIX HAL and
      # the host application (a CMake compile database of firmware/lib/zplc_core, nothing is built for it). The Zephyr
      # HAL and firmware/app are analysed where a west build tree exists: tools/firmware-test/run.sh tidy.
      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-tidy

      - name: Static analysis (clang-tidy, warnings are errors)
        run: |
          python3 tools/ci/test_run_clang_tidy.py
          python3 tools/ci/run_clang_tidy.py

      # VF-014: the loader fuzzer (mutations keep the CRC valid) and the run fuzzer (accepted artifacts are
      # executed under the sanitizers) for 60 seconds each, in parallel. A finding fails the job and its
      # reproducer is printed in the log (base64). The long run is proposed in tools/fuzz/nightly-fuzz.proposed.yml.
      - name: Fuzz loader verification and artifact execution (short)
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
          ZPLC_FUZZ_WORK: ${{ runner.temp }}/zplc-fuzz
          ZPLC_FUZZ_ARTIFACTS: ${{ runner.temp }}/zplc-fuzz-artifacts
        run: tools/fuzz/run.sh 60 both

  zephyr-twister:
    name: Zephyr Twister (native_sim/native/64)
    runs-on: ubuntu-latest
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          path: zplc

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Test the firmware test report tool
        run: python3 zplc/tools/firmware-test/test_fwtest.py

      - name: Test the footprint report
        run: python3 zplc/tools/firmware-test/test_footprint_report.py

      # VF-026: the Zephyr checkout, the SDK and the pip downloads are kept between runs under a key of the manifest, so
      # that a run restores them and `west update` only fetches what changed. A restored workspace is never trusted: the
      # set-up below still checks the revision of zephyr and the SDK toolchains, and installs the SDK only when it is absent.
      - name: Restore the Zephyr workspace, the SDK and the pip cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ github.workspace }}/.west
            ${{ github.workspace }}/zephyr
            ${{ github.workspace }}/modules
            ${{ github.workspace }}/bootloader
            ${{ github.workspace }}/tools
            ${{ runner.temp }}/zephyr-sdk-1.0.1
            ~/.cache/pip
          key: zephyr-${{ runner.os }}-${{ hashFiles('zplc/west.yml') }}-sdk-1.0.1

      - name: Setup pinned Zephyr workspace
        shell: bash
        env:
          ZPLC_WEST_SDK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZEPHYR_SDK_INSTALL_DIR="${RUNNER_TEMP}/zephyr-sdk-1.0.1"
          echo "ZEPHYR_SDK_INSTALL_DIR=${ZEPHYR_SDK_INSTALL_DIR}" >> "${GITHUB_ENV}"
          VENV_DIR="${RUNNER_TEMP}/zplc-zephyr-venv"
          python3 -m venv "${VENV_DIR}"
          "${VENV_DIR}/bin/pip" install west==1.5.0
          if [ ! -d "${GITHUB_WORKSPACE}/.west" ]; then
            "${VENV_DIR}/bin/west" init -l "${GITHUB_WORKSPACE}/zplc"
          fi
          "${VENV_DIR}/bin/west" update
          test "$(git -C "${GITHUB_WORKSPACE}/zephyr" rev-parse HEAD)" = "dccb09599635bdff17633fa7e9dab014b91dce90"
          "${VENV_DIR}/bin/west" zephyr-export
          "${VENV_DIR}/bin/west" packages pip --install --ignore-venv-check
          if [ ! -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/arm-zephyr-eabi" ] || [ ! -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/xtensa-espressif_esp32s3_zephyr-elf" ]; then
            "${VENV_DIR}/bin/west" sdk install --version 1.0.1 --install-dir "${ZEPHYR_SDK_INSTALL_DIR}" --gnu-toolchains arm-zephyr-eabi xtensa-espressif_esp32s3_zephyr-elf --personal-access-token "${ZPLC_WEST_SDK_GITHUB_TOKEN}"
          fi
          test -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/arm-zephyr-eabi"
          test -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/xtensa-espressif_esp32s3_zephyr-elf"
          echo "${VENV_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Run Twister
        run: west twister -T zplc/firmware/tests -p native_sim/native/64 --inline-logs --outdir "${RUNNER_TEMP}/zplc-twister"

      - name: Install the 32-bit C runtime for native_sim/native
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends gcc-multilib

      - name: Run Twister on 32-bit native_sim and QEMU (Cortex-M3, Cortex-M0)
        env:
          ZPLC_FW_WS: ${{ github.workspace }}
        run: zplc/tools/firmware-test/run.sh native32 qemu-m3 qemu-m0

      # REL-023: the application is built for native_sim and its shell is driven over stdin and stdout, so the
      # commit, board, ABI and options that `zplc version` and `zplc sys build` report are read from a real shell.
      - name: Check the firmware identity reported by the application shell
        env:
          ZPLC_FW_WS: ${{ github.workspace }}
        run: python3 zplc/firmware/tests/app_shell_identity/test_app_shell_identity.py

      # COM-019 to COM-028: the framed device link on the firmware application, on a real shell: the session rule,
      # an atomic write, forces that end with their session, a download read back, events and a damaged frame.
      - name: Check the framed device link of the application
        env:
          ZPLC_FW_WS: ${{ github.workspace }}
        run: python3 zplc/firmware/tests/app_device_link/test_app_device_link.py

  zephyr-cross-build:
    name: Zephyr cross-build (${{ matrix.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # tidy_board names the board in tools/ci/clang-tidy-app-baseline.json (the board ids of
          # firmware/app/boards/boards.json). tools/hil/validate_supported_boards.py checks that every board
          # of the manifest is in this matrix (IO-011).
          - id: rpi-pico
            board: rpi_pico/rp2040
            tidy_board: rpi-pico-rp2040
          - id: arduino-giga-r1
            board: arduino_giga_r1/stm32h747xx/m7
            tidy_board: arduino-giga-r1-m7
          - id: esp32s3-devkitc
            board: esp32s3_devkitc/esp32s3/procpu
            tidy_board: esp32-s3-devkitc
          - id: stm32f746g-disco
            board: stm32f746g_disco/stm32f746xx
            tidy_board: stm32f746g-disco
          - id: nucleo-h743zi
            board: nucleo_h743zi/stm32h743xx
            tidy_board: nucleo-h743zi
          - id: arduino-opta
            board: arduino_opta/stm32h747xx/m7
            tidy_board: arduino-opta-wifi-m7
          - id: waveshare-rp2040-zero
            board: rp2040_zero/rp2040
            tidy_board: waveshare-rp2040-zero
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          path: zplc

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # VF-026: the Zephyr checkout, the SDK and the pip downloads are kept between runs under a key of the manifest, so
      # that a run restores them and `west update` only fetches what changed. A restored workspace is never trusted: the
      # set-up below still checks the revision of zephyr and the SDK toolchains, and installs the SDK only when it is absent.
      - name: Restore the Zephyr workspace, the SDK and the pip cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ github.workspace }}/.west
            ${{ github.workspace }}/zephyr
            ${{ github.workspace }}/modules
            ${{ github.workspace }}/bootloader
            ${{ github.workspace }}/tools
            ${{ runner.temp }}/zephyr-sdk-1.0.1
            ~/.cache/pip
          key: zephyr-${{ runner.os }}-${{ hashFiles('zplc/west.yml') }}-sdk-1.0.1

      - name: Setup pinned Zephyr workspace
        shell: bash
        env:
          ZPLC_WEST_SDK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZEPHYR_SDK_INSTALL_DIR="${RUNNER_TEMP}/zephyr-sdk-1.0.1"
          echo "ZEPHYR_SDK_INSTALL_DIR=${ZEPHYR_SDK_INSTALL_DIR}" >> "${GITHUB_ENV}"
          VENV_DIR="${RUNNER_TEMP}/zplc-zephyr-venv"
          python3 -m venv "${VENV_DIR}"
          "${VENV_DIR}/bin/pip" install west==1.5.0
          if [ ! -d "${GITHUB_WORKSPACE}/.west" ]; then
            "${VENV_DIR}/bin/west" init -l "${GITHUB_WORKSPACE}/zplc"
          fi
          "${VENV_DIR}/bin/west" update
          test "$(git -C "${GITHUB_WORKSPACE}/zephyr" rev-parse HEAD)" = "dccb09599635bdff17633fa7e9dab014b91dce90"
          "${VENV_DIR}/bin/west" zephyr-export
          "${VENV_DIR}/bin/west" packages pip --install --ignore-venv-check
          if [ ! -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/arm-zephyr-eabi" ] || [ ! -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/xtensa-espressif_esp32s3_zephyr-elf" ]; then
            "${VENV_DIR}/bin/west" sdk install --version 1.0.1 --install-dir "${ZEPHYR_SDK_INSTALL_DIR}" --gnu-toolchains arm-zephyr-eabi xtensa-espressif_esp32s3_zephyr-elf --personal-access-token "${ZPLC_WEST_SDK_GITHUB_TOKEN}"
          fi
          test -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/arm-zephyr-eabi"
          test -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/xtensa-espressif_esp32s3_zephyr-elf"
          echo "${VENV_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Fetch ESP32 HAL blobs
        if: matrix.id == 'esp32s3-devkitc'
        run: west blobs fetch hal_espressif

      - name: Cross-build firmware app
        shell: bash
        run: |
          set -o pipefail
          west build -p always -b "${{ matrix.board }}" zplc/firmware/app -d "${RUNNER_TEMP}/zplc-${{ matrix.id }}" 2>&1 | tee "${RUNNER_TEMP}/zplc-${{ matrix.id }}.build.log"

      # VF-018: clang-tidy over the Zephyr HAL, the scheduler, the core as built for this board and firmware/app, with
      # the compile commands of the build above rewritten for clang. The core and the HAL must report nothing; the
      # findings that firmware/app still has are counted per board in tools/ci/clang-tidy-app-baseline.json and a
      # new one fails the step. The Xtensa board (esp32s3-devkitc) has no clang target and is skipped by the script.
      - name: Static analysis of the Zephyr HAL and firmware/app (clang-tidy, warnings are errors)
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang-tidy
          python3 zplc/tools/ci/run_clang_tidy.py --zephyr-only \
            --zephyr-build "${RUNNER_TEMP}/zplc-${{ matrix.id }}" --board "${{ matrix.tidy_board }}"

      - name: Check flash and RAM against the size budget
        shell: bash
        run: |
          status=0
          python3 zplc/tools/firmware-test/fwtest.py size \
            --budget zplc/tools/firmware-test/size-budget.json \
            --log "${RUNNER_TEMP}/zplc-${{ matrix.id }}.build.log" \
            --zephyr-board "${{ matrix.board }}" > "${RUNNER_TEMP}/size-${{ matrix.id }}.txt" || status=$?
          cat "${RUNNER_TEMP}/size-${{ matrix.id }}.txt"
          {
            echo '### Flash and RAM: ${{ matrix.id }}'
            echo '```text'
            cat "${RUNNER_TEMP}/size-${{ matrix.id }}.txt"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

      - name: Keep cross-build firmware
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: firmware-${{ matrix.id }}
          path: ${{ runner.temp }}/zplc-${{ matrix.id }}/zephyr/zephyr.*
          if-no-files-found: error

      # VF-025: the report of every board is a file of the run as well as a job summary, also when the budget is exceeded.
      - name: Keep the flash and RAM report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: size-${{ matrix.id }}
          path: ${{ runner.temp }}/size-${{ matrix.id }}.txt
          if-no-files-found: ignore
          retention-days: 30

  docs-and-truth:
    name: Docs and truth sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          test -f bun.lock
          bun install --frozen-lockfile

      - name: Validate repository truth sources
        run: |
          python3 tools/hil/audit_repo_hygiene.py
          python3 tools/hil/audit_specs_scope.py
          python3 tools/hil/validate_release_evidence.py
          python3 tools/hil/validate_supported_boards.py
          python3 tools/hil/validate_hil_trace_profile.py
          python3 tools/hil/test_validate_supported_boards.py
          python3 tools/hil/test_board_io_description.py
          python3 tools/hil/test_io_table_generator.py
          python3 tools/ci/test_check_hal_contract.py
          python3 tools/ci/check_hal_contract.py
          python3 tools/hil/test_validate_release_evidence.py
          python3 tools/docs/test_validate_docs_pages.py
          python3 tools/docs/validate_docs_pages.py
          python3 tools/docs/test_generate_known_limits.py
          python3 tools/docs/generate_known_limits.py --check
          bun tools/docs/generate_function_reference.ts --check
          bun tools/docs/generate_source_references.ts --check
          bun tools/docs/generate_language_reference.ts --check
          bun tools/docs/check_doc_claims.ts
          bun tools/ci/test-inventory.ts
          bun tools/ci/test-source-guard.ts

      - name: Check the generated binary contract
        run: bun run contract:check

      # VF-020: a documentation sample whose fence says `runnable` is compiled, and run on the native runtime when it
      # states a result. The compiler package and the runtime are built here for it.
      - name: Build the compiler and the native runtime for the documentation samples
        run: |
          bun run build:compiler
          cmake -S firmware/lib/zplc_core -B "${RUNNER_TEMP}/zplc-docs-runtime" -DCMAKE_BUILD_TYPE=Release
          cmake --build "${RUNNER_TEMP}/zplc-docs-runtime" --target zplc_runtime --parallel

      - name: Check the runnable documentation samples
        env:
          ZPLC_NATIVE_SIM_BIN: ${{ runner.temp }}/zplc-docs-runtime/zplc_runtime
        run: bun tools/docs/check-docs-samples.ts

      - name: Generate and validate documentation references
        run: |
          bun run docs:generate
          bun run docs:validate
          # every generated page lives below these two folders: a page that differs from what the generators write fails the job
          git diff --exit-code -- docs/docs docs/i18n
          bun run docs:build
