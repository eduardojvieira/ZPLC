name: ZPLC Nightly Quality

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loader-fuzz:
    name: Extended loader verification fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Build and fuzz loader verification
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: halt_on_error=1
        run: |
          cmake -S firmware/lib/zplc_core -B "${{ runner.temp }}/zplc-loader-fuzz-build" \
            -DCMAKE_C_COMPILER=clang -DZPLC_BUILD_FUZZER=ON
          cmake --build "${{ runner.temp }}/zplc-loader-fuzz-build" --target fuzz_loader_verify --parallel
          corpus_dir="$(mktemp -d)"
          trap 'rm -rf -- "$corpus_dir"' EXIT
          python3 - "$corpus_dir" <<'PY'
          import sys
          from pathlib import Path

          fixture = Path("firmware/lib/zplc_core/tests/fixtures/zplc-v1-code-task-tags.hex")
          Path(sys.argv[1], "fixture").write_bytes(bytes.fromhex(fixture.read_text()))
          PY
          "${{ runner.temp }}/zplc-loader-fuzz-build/fuzz_loader_verify" "$corpus_dir" \
            -max_total_time=900 -max_len=65536 -timeout=2

  native-sim-twister:
    name: Repeated Zephyr Twister (native_sim)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          path: zplc

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup pinned Zephyr workspace
        shell: bash
        run: |
          set -euo pipefail
          ZEPHYR_SDK_INSTALL_DIR="${RUNNER_TEMP}/zephyr-sdk-1.0.1"
          echo "ZEPHYR_SDK_INSTALL_DIR=${ZEPHYR_SDK_INSTALL_DIR}" >> "${GITHUB_ENV}"
          VENV_DIR="${RUNNER_TEMP}/zplc-zephyr-venv"
          python3 -m venv "${VENV_DIR}"
          "${VENV_DIR}/bin/pip" install west==1.5.0
          "${VENV_DIR}/bin/west" init -l "${GITHUB_WORKSPACE}/zplc"
          "${VENV_DIR}/bin/west" update
          test "$(git -C "${GITHUB_WORKSPACE}/zephyr" rev-parse HEAD)" = "dccb09599635bdff17633fa7e9dab014b91dce90"
          "${VENV_DIR}/bin/west" zephyr-export
          "${VENV_DIR}/bin/west" packages pip --install --ignore-venv-check
          "${VENV_DIR}/bin/west" sdk install --version 1.0.1 --install-dir "${ZEPHYR_SDK_INSTALL_DIR}" --gnu-toolchains arm-zephyr-eabi xtensa-espressif_esp32s3_zephyr-elf
          test -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/arm-zephyr-eabi"
          test -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/xtensa-espressif_esp32s3_zephyr-elf"
          echo "${VENV_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Run Twister twice from clean output directories
        run: |
          west twister -T zplc/firmware/tests -p native_sim --inline-logs --outdir "${RUNNER_TEMP}/zplc-twister-1"
          west twister -T zplc/firmware/tests -p native_sim --inline-logs --outdir "${RUNNER_TEMP}/zplc-twister-2"
