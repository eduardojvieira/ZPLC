name: Deploy Documentation

on:
  push:
    branches: [master, main]
    paths:
      - 'docs/**'
      - 'tools/docs/**'
      - 'tools/hil/validate_docs_parity.py'
      - 'firmware/lib/zplc_core/include/**'
      - 'firmware/app/boards/supported-boards.v1.5.0.json'
  pull_request:
    branches: [master, main]
    paths:
      - 'docs/**'
      - 'tools/docs/**'
      - 'tools/hil/validate_docs_parity.py'
      - 'firmware/lib/zplc_core/include/**'
      - 'firmware/app/boards/supported-boards.v1.5.0.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Install documentation dependencies
        run: |
          test -f bun.lock
          bun install --frozen-lockfile

      - name: Generate and validate docs references
        working-directory: docs
        run: |
          bun run generate:v1.5-docs
          bun run validate:v1.5-docs

      - name: Build documentation
        working-directory: docs
        run: bun run build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/build

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
