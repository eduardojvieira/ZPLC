name: Deploy Documentation

# PUB-005: the site changes with the release and not before. It is published when a person publishes a release (built from
# the tag of that release), or by a manual dispatch for a docs-only fix: the dispatched ref must descend from the latest
# published release tag and change nothing outside docs/ (tools/ci/docs-dispatch-guard.ts). A push builds nothing here.
# Pull requests build the site to check it and never deploy.

on:
  release:
    types: [published]
  pull_request:
    branches: [master, main, zplc-2.0-candidate]
    paths:
      - 'docs/**'
      - 'tools/docs/**'
      - 'tools/hil/validate_docs_parity.py'
      - 'firmware/lib/zplc_core/include/**'
      - 'firmware/app/boards/boards.json'
      - 'packages/zplc-ide/**'
      - 'packages/zplc-compiler/**'
      - 'tools/wasm-core/**'
      - 'firmware/lib/zplc_core/src/**'
      - 'firmware/apps/posix_host/src/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to publish. It must descend from the latest published release tag and change only docs/.'
        required: true
        type: string

permissions:
  contents: read

# Every deploy (release or dispatch) shares one group and queues behind the one running; a pull request build has its own
# group per ref, so it can never replace a pending deploy.
concurrency:
  group: ${{ (github.event_name == 'release' || github.event_name == 'workflow_dispatch') && 'pages' || format('docs-build-{0}', github.ref) }}
  cancel-in-progress: false

jobs:
  # Runs only for a dispatch, before anything is built: every refusal fails this job and so the whole run.
  guard:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - name: Checkout the requested ref with every tag
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Refuse unless the ref descends from the latest release and changes only docs
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags origin
          tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --exclude-pre-releases --limit 1 --json tagName --jq '.[0].tagName // empty')"
          if [ -z "$tag" ]; then echo "refused: no published release to descend from." >&2; exit 1; fi
          out="$(bun tools/ci/docs-dispatch-guard.ts --tag "$tag" --ref HEAD)"
          echo "$out" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    if: ${{ !cancelled() && (needs.guard.result == 'success' || needs.guard.result == 'skipped') && (github.event_name != 'release' || !github.event.release.prerelease) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20 # generating and validating took 1 s and the documentation build 134 s on 4 cores
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          # the tag of the published release, or the exact commit the guard accepted; empty on a pull request
          ref: ${{ github.event.release.tag_name || needs.guard.outputs.sha || '' }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Install documentation dependencies
        run: |
          test -f bun.lock
          bun install --frozen-lockfile

      - name: Generate and validate docs references
        working-directory: docs
        run: |
          bun run generate:docs
          bun run validate:docs

      # The footer shows the release being published, or the tag the dispatch descends from; a pull request build shows the
      # latest published release (prereleases included, drafts never), and with no release yet or no network, the tree's version.
      - name: Name the latest release for the site
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name || needs.guard.outputs.tag }}
        run: |
          tag="$EVENT_TAG"
          [ -n "$tag" ] || tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // empty' || true)"
          if [ -n "$tag" ]; then echo "ZPLC_RELEASE_TAG=$tag" >> "$GITHUB_ENV"; fi

      - name: Build documentation
        working-directory: docs
        run: bun run build
        env:
          NODE_OPTIONS: '--max_old_space_size=4096'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs/build

  deploy:
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20 # not measured here: actions/deploy-pages waits up to 10 min for the deployment by default
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
