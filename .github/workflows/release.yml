# =============================================================================
# ZPLC Release Build Workflow
# =============================================================================
# Builds cross-platform IDE binaries for releases.
#
# Triggers:
#   - Manual dispatch (workflow_dispatch) with version input
#   - Push of version tags that match v*
#
# Artifacts:
#   - IDE: macOS (x64, arm64), Windows (x64, arm64), Linux (x64, arm64)
#
# Architecture:
#   Each matrix job builds ONE architecture only. The arch is passed to
#   electron-builder via CLI flag (--x64 or --arm64). The electron-builder.yml
#   has NO hardcoded arch arrays to prevent double builds.
# =============================================================================

name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.0.0-rc.1)'
        required: true
        type: string
      upload_to_release:
        description: 'Upload artifacts to GitHub Release'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  # Retry config for transient CDN failures
  ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder

jobs:
  # Resolve the release identity once from the checked-out commit. Builds consume
  # that identity but never rewrite repository metadata during a release.
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Validate canonical version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REQUESTED_VERSION: "${{ inputs.version }}"
          UPLOAD_TO_RELEASE: "${{ inputs.upload_to_release }}"
          REF_NAME: ${{ github.ref_name }}
        run: |
          bun run check:versions
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            requested="$REQUESTED_VERSION"
          else
            requested="${REF_NAME#v}"
          fi
          canonical_version="$(bun -e 'console.log(JSON.parse(require("fs").readFileSync("package.json", "utf8")).version)')"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$UPLOAD_TO_RELEASE" = "true" ] && [ "$EVENT_REF" != "refs/tags/v$canonical_version" ]; then
            echo "Select the exact release tag refs/tags/v$canonical_version before uploading a release."
            exit 1
          fi
          if [ "$requested" != "$canonical_version" ]; then
            echo "Requested release version $requested does not match canonical package.json version $canonical_version"
            exit 1
          fi
          echo "version=$canonical_version" >> "$GITHUB_OUTPUT"
          echo "tag=v$canonical_version" >> "$GITHUB_OUTPUT"

  # ===========================================================================
  # Build IDE for macOS (x64 and arm64)
  # ===========================================================================
  build-macos:
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          test -f bun.lock
          bun install --frozen-lockfile

      - name: Build dependencies
        run: |
          cd packages/zplc-compiler && bun run build

      - name: Build Electron app (macOS ${{ matrix.arch }})
        working-directory: packages/zplc-ide
        run: |
          bun run scripts/package-mac-release.mjs ${{ matrix.arch }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ZPLC_MAC_COPY_APP_BUNDLE: '1'

      - name: Verify macOS bundle code signing
        working-directory: packages/zplc-ide
        run: |
          APP_PATH=$(python3 - <<'PY'
          from pathlib import Path
          apps = sorted(Path('dist-electron').glob('mac*/**/*.app'))
          print(apps[0] if apps else '')
          PY
          )
          if [ -z "$APP_PATH" ]; then
            echo "Missing .app bundle in dist-electron"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          codesign -dv --verbose=4 "$APP_PATH" 2>&1
          codesign -dv --verbose=4 "$APP_PATH/Contents/Frameworks/Electron Framework.framework/Versions/A/Electron Framework" 2>&1

      - name: Validate macOS build artifacts
        working-directory: packages/zplc-ide
        run: bun run smoke:desktop-builds macos ${{ matrix.arch }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}
          path: |
            packages/zplc-ide/dist-electron/*.dmg
            packages/zplc-ide/dist-electron/*.zip
          retention-days: 7

  # ===========================================================================
  # Build IDE for Windows (x64 and arm64)
  # ===========================================================================
  build-windows:
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            cmake_arch: x64
          - arch: arm64
            runner: windows-11-vs2026-arm
            cmake_arch: ARM64
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        shell: bash
        run: |
          test -f bun.lock
          bun install --filter '!./' --filter './packages/zplc-ide' --filter './packages/zplc-compiler' --frozen-lockfile

      - name: Build dependencies
        run: |
          cd packages/zplc-compiler && bun run build

      - name: Build native simulator runtime
        shell: bash
        run: |
          cmake -S firmware/lib/zplc_core -B firmware/lib/zplc_core/build -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release
          cmake --build firmware/lib/zplc_core/build --target zplc_runtime --config Release
          mkdir -p packages/zplc-ide/dist-native
          if [ -f firmware/lib/zplc_core/build/zplc_runtime.exe ]; then
            cp firmware/lib/zplc_core/build/zplc_runtime.exe packages/zplc-ide/dist-native/
          else
            cp firmware/lib/zplc_core/build/Release/zplc_runtime.exe packages/zplc-ide/dist-native/
          fi

      - name: Build Electron app (Windows ${{ matrix.arch }})
        working-directory: packages/zplc-ide
        run: |
          bun run build:assets
          bun run build
          bun run electron:compile
          bun x electron-builder --win --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Windows build artifacts
        working-directory: packages/zplc-ide
        shell: bash
        run: bun run smoke:desktop-builds windows ${{ matrix.arch }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            packages/zplc-ide/dist-electron/*-Setup.exe
            packages/zplc-ide/dist-electron/*-Portable.exe
          retention-days: 7

  # ===========================================================================
  # Build IDE for Linux (x64 and arm64)
  # ===========================================================================
  build-linux:
    needs: validate-version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          test -f bun.lock
          bun install --frozen-lockfile

      - name: Build dependencies
        run: |
          cd packages/zplc-compiler && bun run build

      - name: Build native simulator runtime
        run: |
          cmake -S firmware/lib/zplc_core -B firmware/lib/zplc_core/build -DCMAKE_BUILD_TYPE=Release
          cmake --build firmware/lib/zplc_core/build --target zplc_runtime --config Release
          mkdir -p packages/zplc-ide/dist-native
          cp firmware/lib/zplc_core/build/zplc_runtime packages/zplc-ide/dist-native/

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Build Electron app (Linux ${{ matrix.arch }})
        working-directory: packages/zplc-ide
        run: |
          bun run build:assets
          bun run build
          bun run electron:compile
          bun x electron-builder --linux --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Linux build artifacts
        working-directory: packages/zplc-ide
        run: bun run smoke:desktop-builds linux ${{ matrix.arch }}

      - name: Launch packaged Linux app
        working-directory: packages/zplc-ide
        run: bun run smoke:desktop-packaged

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            packages/zplc-ide/dist-electron/*.AppImage
            packages/zplc-ide/dist-electron/*.deb
            packages/zplc-ide/dist-electron/*.rpm
          retention-days: 7

  # ===========================================================================
  # Prepare integrity evidence for every candidate, including dry-runs.
  # ===========================================================================
  prepare-release-evidence:
    needs: [validate-version, build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - name: Bind evidence to the checked-out SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: artifacts
          format: spdx-json
          output-file: artifacts/ZPLC-${{ needs.validate-version.outputs.version }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - name: Create release integrity bundle
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: |
          node scripts/release-artifacts.mjs \
            --input-dir artifacts \
            --output-dir release \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit-sha "$RELEASE_COMMIT_SHA"

      - name: Attest installer provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/*-Setup.exe
            release/*-Portable.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm

      - name: Attest installer SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/*-Setup.exe
            release/*-Portable.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
          sbom-path: artifacts/ZPLC-${{ needs.validate-version.outputs.version }}.spdx.json

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle
          path: release/
          retention-days: 7

  # ===========================================================================
  # Upload the already-attested integrity bundle to GitHub Release.
  # ===========================================================================
  upload-release:
    needs: [validate-version, prepare-release-evidence]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # Skip upload when workflow_dispatch with upload_to_release=false (dry-run testing)
    if: >-
      ${{
        always()
        && (github.event_name == 'push' || inputs.upload_to_release != false)
        && needs.validate-version.result == 'success'
        && needs.prepare-release-evidence.result == 'success'
      }}
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle
          path: release/

      - name: Update release with assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.validate-version.outputs.tag }}
          name: "ZPLC v${{ needs.validate-version.outputs.version }}"
          prerelease: ${{ contains(needs.validate-version.outputs.version, '-') }}
          body: |
            ## Release v${{ needs.validate-version.outputs.version }}

            ### Repository evidence
            - Release artifacts include checksums, an SPDX SBOM, and identity evidence produced by this workflow.
            - `ST`, `IL`, `LD`, `FBD`, and `SFC` are described only at the repository-declared and automated-tested workflow level.
            - `firmware/app/boards/supported-boards.v1.5.0.json` is the current board catalog/evidence baseline, not 2.0 HIL qualification.

            ### Evidence boundary
            Repository and hosted workflow results do not establish HIL, board qualification, timing, safety certification, or human release sign-off.
            Prerelease tags remain release candidates, not GA declarations.

            ### IDE Downloads

            #### macOS
            | Architecture | DMG | ZIP |
            |-------------|-----|-----|
            | Apple Silicon (M1/M2/M3) | `ZPLC IDE-*-mac-arm64.dmg` | `ZPLC IDE-*-mac-arm64.zip` |
            | Intel (x64) | `ZPLC IDE-*-mac-x64.dmg` | `ZPLC IDE-*-mac-x64.zip` |

            #### Windows
            | Architecture | Installer | Portable |
            |-------------|-----------|----------|
            | x64 (64-bit) | `ZPLC IDE-*-win-x64-Setup.exe` | `ZPLC IDE-*-win-x64-Portable.exe` |
            | ARM64 | `ZPLC IDE-*-win-arm64-Setup.exe` | - |

            #### Linux
            | Architecture | AppImage | DEB | RPM |
            |-------------|----------|-----|-----|
            | x64 (64-bit) | `ZPLC IDE-*-linux-x64.AppImage` | `ZPLC IDE-*-linux-x64.deb` | `ZPLC IDE-*-linux-x64.rpm` |
            | ARM64 | `ZPLC IDE-*-linux-arm64.AppImage` | `ZPLC IDE-*-linux-arm64.deb` | - |

            ### Board catalog/evidence baseline

            See the canonical manifest and generated docs reference instead of treating this release body as a separate source of truth:

            - `firmware/app/boards/supported-boards.v1.5.0.json`
            - https://eduardojvieira.github.io/ZPLC/reference/boards

            ### Documentation

            - 📚 [Full Documentation](https://eduardojvieira.github.io/ZPLC/)
            - 📖 [Reference Documentation](https://eduardojvieira.github.io/ZPLC/reference)
          files: |
            release/*.dmg
            release/*.zip
            release/*-Setup.exe
            release/*-Portable.exe
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/*.spdx.json
            release/SHA256SUMS
            release/release-evidence.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
