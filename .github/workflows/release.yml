# =============================================================================
# ZPLC Release Build Workflow
# =============================================================================
# Builds cross-platform IDE binaries for releases.
#
# Triggers:
#   - Manual dispatch (workflow_dispatch) with the version and the rehearsal input. The rehearsal input is ticked by
#     default and runs the whole pipeline, notes included, and publishes nothing: no draft, no upload, no attestation
#     (REL-030). Untick it only on the exact release tag.
#   - Push of version tags that match v*
#
# Artifacts:
#   - IDE: macOS (x64, arm64), Windows (x64, arm64), Linux (x64, arm64)
#   - Runtime firmware: one image set for every board of firmware/app/boards/boards.json (REL-022)
#
# Publication:
#   The release is created only here, as a draft, from the run of its own tag (REL-016). Each platform
#   builds, collects its integrity evidence and uploads to the draft in jobs of its own, so a failure on one
#   platform never blocks the others (REL-015). A person publishes the draft after the first-run checks.
#
# Architecture:
#   Each matrix job builds ONE architecture only. The arch is passed to
#   electron-builder via CLI flag (--x64 or --arm64). The electron-builder.yml
#   has NO hardcoded arch arrays to prevent double builds.
# =============================================================================

name: Release Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 2.0.0-rc.3)'
        required: true
        type: string
      rehearsal:
        description: 'Rehearsal: run everything and publish nothing (no draft release, no upload, no attestation). Untick only on the exact release tag.'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  NODE_VERSION: '20'
  # Retry config for transient CDN failures
  ELECTRON_BUILDER_CACHE: ~/.cache/electron-builder

jobs:
  # Resolve the release identity once from the checked-out commit. Builds consume
  # that identity but never rewrite repository metadata during a release.
  validate-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publishing: ${{ steps.version.outputs.publishing }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      # What this run may publish is decided by scripts/release/resolve-release.ts, which is tested with the events
      # of the workflow; the changelog and the bill of materials are checked here so that a bad release stops early.
      - name: Resolve the release identity and check the records of the release
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          REQUESTED_VERSION: "${{ inputs.version }}"
          REHEARSAL: "${{ inputs.rehearsal }}"
        run: |
          bun run check:versions
          bun scripts/release/resolve-release.ts
          bun scripts/release/changelog.ts --check
          bun scripts/release/sbom.ts --check

  # Run the canonical CI workflow for this caller's exact SHA before any
  # release artifact can be built. HIL remains intentionally out of CI.
  verify-release-candidate:
    needs: validate-version
    uses: ./.github/workflows/ci.yml

  # This checks only the unpacked Linux x64 application payload (app.asar plus native POSIX runtime). Installers and
  # other operating systems are out of scope. The check is kept and it never blocks a release run (REL-032): it covers
  # one of six targets, so the job does not fail the run (continue-on-error) and no other job waits for it, the notes
  # included: its result is read in the run, and the notes make no claim about it.
  verify-linux-x64-payload-reproducibility:
    needs: [validate-version, verify-release-candidate]
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      # IDE-025: the IDE build embeds the WebAssembly runtime (clang and wasm-ld), and fails where CI is set without them.
      - name: Install the WebAssembly toolchain
        run: |
          sudo apt-get install --yes --no-install-recommends clang lld

      - name: Build two clean Linux x64 payloads from the exact SHA
        shell: bash
        run: |
          set -euo pipefail
          reproducibility_root="$RUNNER_TEMP/zplc-linux-x64-reproducibility"
          first_workspace="$reproducibility_root/first"
          second_workspace="$reproducibility_root/second"
          git worktree add --detach "$first_workspace" "${{ github.sha }}"
          git worktree add --detach "$second_workspace" "${{ github.sha }}"

          build_payload() {
            workspace="$1"
            (
              cd "$workspace"
              export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${{ github.sha }}")"
              test -f bun.lock
              bun install --frozen-lockfile
              (cd packages/zplc-compiler && bun run build)
              cmake -S firmware/lib/zplc_core -B firmware/lib/zplc_core/build -DCMAKE_BUILD_TYPE=Release
              cmake --build firmware/lib/zplc_core/build --target zplc_runtime --config Release
              mkdir -p packages/zplc-ide/dist-native
              cp firmware/lib/zplc_core/build/zplc_runtime packages/zplc-ide/dist-native/
              (
                cd packages/zplc-ide
                bun run build:assets
                bun run build
                bun run electron:compile
                bun x electron-builder --linux --x64 --publish never
              )
            )
          }

          build_payload "$first_workspace"
          build_payload "$second_workspace"

      - name: Verify Linux x64 packaged payload reproducibility (not installers)
        run: |
          bun "$RUNNER_TEMP/zplc-linux-x64-reproducibility/first/packages/zplc-ide/scripts/verify-reproducible-linux-payload.ts" \
            "$RUNNER_TEMP/zplc-linux-x64-reproducibility/first/packages/zplc-ide" \
            "$RUNNER_TEMP/zplc-linux-x64-reproducibility/second/packages/zplc-ide"

  # ===========================================================================
  # Prebuilt runtime firmware for every board of the manifest (REL-022). One job per board builds firmware/app from the
  # exact SHA, and scripts/release/firmware-images.ts refuses an image made for another board, version or commit, from
  # a dirty tree or with the HIL trace. The matrix is the board list of firmware/app/boards/boards.json (a test of
  # packages/zplc-ide/scripts/release-config.test.ts compares them). Nothing here flashes a board.
  # ===========================================================================
  build-firmware:
    needs: [validate-version, verify-release-candidate]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ide_id: rpi_pico
            board: rpi_pico/rp2040
          - ide_id: arduino_giga_r1
            board: arduino_giga_r1/stm32h747xx/m7
          - ide_id: esp32s3_devkitc
            board: esp32s3_devkitc/esp32s3/procpu
          - ide_id: stm32f746g_disco
            board: stm32f746g_disco/stm32f746xx
          - ide_id: nucleo_h743zi
            board: nucleo_h743zi/stm32h743xx
          - ide_id: arduino_opta_wifi
            board: arduino_opta/stm32h747xx/m7
          - ide_id: waveshare_rp2040_zero
            board: rp2040_zero/rp2040
    env:
      ZEPHYR_TOOLCHAIN_VARIANT: zephyr
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}
          path: zplc

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      # The same workspace, cache key and revision check as the cross-build of ci.yml: a restored workspace is never trusted.
      - name: Restore the Zephyr workspace, the SDK and the pip cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ${{ github.workspace }}/.west
            ${{ github.workspace }}/zephyr
            ${{ github.workspace }}/modules
            ${{ github.workspace }}/bootloader
            ${{ github.workspace }}/tools
            ${{ runner.temp }}/zephyr-sdk-1.0.1
            ~/.cache/pip
          key: zephyr-${{ runner.os }}-${{ hashFiles('zplc/west.yml') }}-sdk-1.0.1

      - name: Setup pinned Zephyr workspace
        shell: bash
        env:
          ZPLC_WEST_SDK_GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ZEPHYR_SDK_INSTALL_DIR="${RUNNER_TEMP}/zephyr-sdk-1.0.1"
          echo "ZEPHYR_SDK_INSTALL_DIR=${ZEPHYR_SDK_INSTALL_DIR}" >> "${GITHUB_ENV}"
          VENV_DIR="${RUNNER_TEMP}/zplc-zephyr-venv"
          python3 -m venv "${VENV_DIR}"
          "${VENV_DIR}/bin/pip" install west==1.5.0
          if [ ! -d "${GITHUB_WORKSPACE}/.west" ]; then
            "${VENV_DIR}/bin/west" init -l "${GITHUB_WORKSPACE}/zplc"
          fi
          "${VENV_DIR}/bin/west" update
          test "$(git -C "${GITHUB_WORKSPACE}/zephyr" rev-parse HEAD)" = "dccb09599635bdff17633fa7e9dab014b91dce90"
          "${VENV_DIR}/bin/west" zephyr-export
          "${VENV_DIR}/bin/west" packages pip --install --ignore-venv-check
          if [ ! -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/arm-zephyr-eabi" ] || [ ! -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/xtensa-espressif_esp32s3_zephyr-elf" ]; then
            "${VENV_DIR}/bin/west" sdk install --version 1.0.1 --install-dir "${ZEPHYR_SDK_INSTALL_DIR}" --gnu-toolchains arm-zephyr-eabi xtensa-espressif_esp32s3_zephyr-elf --personal-access-token "${ZPLC_WEST_SDK_GITHUB_TOKEN}"
          fi
          test -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/arm-zephyr-eabi"
          test -d "${ZEPHYR_SDK_INSTALL_DIR}/gnu/xtensa-espressif_esp32s3_zephyr-elf"
          echo "${VENV_DIR}/bin" >> "${GITHUB_PATH}"

      - name: Fetch ESP32 HAL blobs
        if: matrix.ide_id == 'esp32s3_devkitc'
        run: west blobs fetch hal_espressif

      # Pristine, and with no overlay: an image that carries the HIL trace is refused by the collect step below.
      - name: Build the runtime firmware
        shell: bash
        run: |
          set -o pipefail
          west build -p always -b "${{ matrix.board }}" zplc/firmware/app -d "${RUNNER_TEMP}/zplc-firmware"

      - name: Check the build and name its images
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: |
          set -euo pipefail
          bun zplc/scripts/release/firmware-images.ts collect \
            --board "${{ matrix.ide_id }}" \
            --build-dir "${RUNNER_TEMP}/zplc-firmware" \
            --version "$RELEASE_VERSION" \
            --commit "${{ github.sha }}" \
            --out "${RUNNER_TEMP}/firmware-out"

      - name: Upload the images of the board
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-firmware-board-${{ matrix.ide_id }}
          path: ${{ runner.temp }}/firmware-out
          if-no-files-found: error
          retention-days: 7

  # Joins the boards into one set and one manifest. It refuses a set with a board missing: a release holds the images
  # of every board or none (REL-022). The desktop builds take the learner images from this set.
  assemble-firmware:
    needs: [validate-version, build-firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Download the images of every board
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-firmware-board-*
          path: firmware-boards

      - name: Assemble the release set and its manifest
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
        run: bun scripts/release/firmware-images.ts assemble --in firmware-boards --out firmware-set --version "$RELEASE_VERSION"

      - name: Upload the release set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-firmware-set
          path: firmware-set/
          if-no-files-found: error
          retention-days: 7

  # ===========================================================================
  # Build IDE for macOS (x64 and arm64)
  # ===========================================================================
  build-macos:
    # The installers carry the two learner-board images (REL-025) and so wait for the firmware set, but not for its
    # success: when a board fails to build the installers are still built, without the images, and the notes say so.
    needs: [validate-version, verify-release-candidate, assemble-firmware]
    if: ${{ !cancelled() && needs.validate-version.result == 'success' && needs.verify-release-candidate.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          test -f bun.lock
          bun install --frozen-lockfile

      # IDE-025: the IDE build embeds the WebAssembly runtime, which tools/wasm-core builds with clang and wasm-ld, and the
      # build fails where CI is set and they are missing. Apple's clang has no WebAssembly target: Homebrew's LLVM goes first.
      - name: Install the WebAssembly toolchain
        shell: bash
        run: |
          brew install llvm lld
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: |
          cd packages/zplc-compiler && bun run build

      # REL-025: the manifest of the release firmware and the two learner-board images go inside the installer, so that
      # Studio shows them with no network. The step is skipped when the firmware set is not available.
      - name: Download the release firmware set
        id: firmware
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-firmware-set
          path: firmware-set

      - name: Stage the learner-board firmware images for the installer
        if: ${{ steps.firmware.outcome == 'success' }}
        run: bun scripts/release/firmware-images.ts stage --bundle firmware-set --out packages/zplc-ide/dist-firmware

      - name: Build Electron app (macOS ${{ matrix.arch }})
        working-directory: packages/zplc-ide
        run: |
          bun run scripts/package-mac-release.mjs ${{ matrix.arch }}
        env:
          ZPLC_MAC_COPY_APP_BUNDLE: '1'

      # Hosted macOS runners are the only place this can run (REL-002): ad-hoc signature, sealed resources,
      # hardened runtime, and the native runtime signed with the bundle, on each architecture.
      - name: Verify the macOS bundle is ad-hoc signed and sealed
        working-directory: packages/zplc-ide
        run: bun run scripts/verify-mac-signature.ts ${{ matrix.arch }}

      - name: Validate macOS build artifacts
        working-directory: packages/zplc-ide
        run: bun run smoke:desktop-builds macos ${{ matrix.arch }}

      - name: Launch packaged macOS app
        working-directory: packages/zplc-ide
        run: bun run smoke:desktop-packaged

      # REL-036: the DMG is mounted and the application is copied out of it, as a person does with "drag to
      # Applications"; the ZIP is unpacked. The application that each one holds is verified and launched on this
      # architecture, so each published macOS format is opened on its own system before the draft exists.
      - name: Mount the DMG, copy the application out and launch it
        working-directory: packages/zplc-ide
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          images=(dist-electron/*.dmg)
          [ "${#images[@]}" -eq 1 ] || { echo "Expected exactly one .dmg, found ${#images[@]}"; exit 1; }
          mount_point="$RUNNER_TEMP/zplc-dmg"
          install_dir="$RUNNER_TEMP/zplc-dmg-install"
          mkdir -p "$mount_point" "$install_dir"
          hdiutil attach -nobrowse -readonly -mountpoint "$mount_point" "${images[0]}"
          trap 'hdiutil detach "$mount_point" -force || true' EXIT
          apps=("$mount_point"/*.app)
          [ "${#apps[@]}" -eq 1 ] || { echo "Expected exactly one .app in the disk image, found ${#apps[@]}"; exit 1; }
          app="$install_dir/$(basename "${apps[0]}")"
          ditto "${apps[0]}" "$app"
          codesign --verify --deep --strict "$app"
          ZPLC_PACKAGED_EXECUTABLE="$app/Contents/MacOS/zplc-ide" bun run smoke:desktop-packaged

      - name: Unpack the ZIP and launch the application
        working-directory: packages/zplc-ide
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(dist-electron/*.zip)
          [ "${#archives[@]}" -eq 1 ] || { echo "Expected exactly one .zip, found ${#archives[@]}"; exit 1; }
          target="$RUNNER_TEMP/zplc-zip"
          mkdir -p "$target"
          ditto -x -k "${archives[0]}" "$target"
          apps=("$target"/*.app)
          [ "${#apps[@]}" -eq 1 ] || { echo "Expected exactly one .app in the archive, found ${#apps[@]}"; exit 1; }
          codesign --verify --deep --strict "${apps[0]}"
          ZPLC_PACKAGED_EXECUTABLE="${apps[0]}/Contents/MacOS/zplc-ide" bun run smoke:desktop-packaged

      # REL-034, REL-019: the unpacked application holds the example projects, the lessons and the licence notices.
      - name: Check the content of the packaged application
        working-directory: packages/zplc-ide
        env:
          ZPLC_REQUIRE_FIRMWARE: ${{ steps.firmware.outcome == 'success' && '1' || '0' }}
        run: bun run smoke:packaged-content

      # REL-026: the CLI and the MCP server as standalone executables, built and run on this architecture.
      - name: Build and smoke the standalone CLI and MCP server (macOS ${{ matrix.arch }})
        run: bun scripts/release/binaries.ts --targets mac-${{ matrix.arch }} --out dist-bin --smoke --native

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-${{ matrix.arch }}
          path: |
            packages/zplc-ide/dist-electron/*.dmg
            packages/zplc-ide/dist-electron/*.zip
            dist-bin/*
          retention-days: 7

  # ===========================================================================
  # Build IDE for Windows (x64 and arm64)
  # ===========================================================================
  build-windows:
    # The installers carry the two learner-board images (REL-025) and so wait for the firmware set, but not for its
    # success: when a board fails to build the installers are still built, without the images, and the notes say so.
    needs: [validate-version, verify-release-candidate, assemble-firmware]
    if: ${{ !cancelled() && needs.validate-version.result == 'success' && needs.verify-release-candidate.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2025
            cmake_arch: x64
          - arch: arm64
            runner: windows-11-vs2026-arm
            cmake_arch: ARM64
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        shell: bash
        run: |
          test -f bun.lock
          bun install --filter '@zplc/ide' --filter '@zplc/compiler' --frozen-lockfile

      # IDE-025: the IDE build embeds the WebAssembly runtime (clang and wasm-ld), and fails where CI is set without them.
      - name: Install the WebAssembly toolchain
        shell: bash
        run: |
          choco install llvm --yes --no-progress
          echo "C:\\Program Files\\LLVM\\bin" >> "$GITHUB_PATH"

      - name: Build dependencies
        run: |
          cd packages/zplc-compiler && bun run build

      # REL-025: the manifest of the release firmware and the two learner-board images go inside the installer, so that
      # Studio shows them with no network. The step is skipped when the firmware set is not available.
      - name: Download the release firmware set
        id: firmware
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-firmware-set
          path: firmware-set

      - name: Stage the learner-board firmware images for the installer
        if: ${{ steps.firmware.outcome == 'success' }}
        run: bun scripts/release/firmware-images.ts stage --bundle firmware-set --out packages/zplc-ide/dist-firmware

      - name: Build native simulator runtime
        shell: bash
        run: |
          cmake -S firmware/lib/zplc_core -B firmware/lib/zplc_core/build -A ${{ matrix.cmake_arch }} -DCMAKE_BUILD_TYPE=Release
          cmake --build firmware/lib/zplc_core/build --target zplc_runtime --config Release
          mkdir -p packages/zplc-ide/dist-native
          if [ -f firmware/lib/zplc_core/build/zplc_runtime.exe ]; then
            cp firmware/lib/zplc_core/build/zplc_runtime.exe packages/zplc-ide/dist-native/
          else
            cp firmware/lib/zplc_core/build/Release/zplc_runtime.exe packages/zplc-ide/dist-native/
          fi

      - name: Build Electron app (Windows ${{ matrix.arch }})
        working-directory: packages/zplc-ide
        shell: pwsh
        run: |
          bun run build:assets
          bun run build
          bun run electron:compile
          bun x electron-builder --win --${{ matrix.arch }} --publish never

      - name: Validate Windows build artifacts
        working-directory: packages/zplc-ide
        shell: bash
        run: bun run smoke:desktop-builds windows ${{ matrix.arch }}

      - name: Launch packaged Windows app
        working-directory: packages/zplc-ide
        run: bun run smoke:desktop-packaged

      # REL-036: the setup is run silently (NSIS: /S, and /D= last, the folder it installs to) and the installed
      # application is launched; the portable executable is launched as it is. Both on this architecture.
      - name: Install the setup silently and launch the installed application
        working-directory: packages/zplc-ide
        shell: pwsh
        run: |
          $setup = @(Get-ChildItem dist-electron -Filter '*-setup-unsigned.exe')
          if ($setup.Count -ne 1) { throw "Expected exactly one setup executable, found $($setup.Count)" }
          $target = Join-Path $env:RUNNER_TEMP 'zplc-installed'
          $install = Start-Process -FilePath $setup[0].FullName -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "The silent install exited with $($install.ExitCode)" }
          $executable = Join-Path $target 'zplc-ide.exe'
          if (-not (Test-Path $executable)) { throw "The installer left no $executable" }
          $env:ZPLC_PACKAGED_EXECUTABLE = $executable
          bun run smoke:desktop-packaged
          if ($LASTEXITCODE -ne 0) { throw "The installed application did not launch" }

      - name: Launch the portable executable
        working-directory: packages/zplc-ide
        shell: pwsh
        run: |
          $portable = @(Get-ChildItem dist-electron -Filter '*-portable-unsigned.exe')
          if ($portable.Count -ne 1) { throw "Expected exactly one portable executable, found $($portable.Count)" }
          $env:ZPLC_PACKAGED_EXECUTABLE = $portable[0].FullName
          bun run smoke:desktop-packaged
          if ($LASTEXITCODE -ne 0) { throw "The portable executable did not launch" }

      # REL-034, REL-019: the unpacked application holds the example projects, the lessons and the licence notices.
      - name: Check the content of the packaged application
        working-directory: packages/zplc-ide
        env:
          ZPLC_REQUIRE_FIRMWARE: ${{ steps.firmware.outcome == 'success' && '1' || '0' }}
        run: bun run smoke:packaged-content

      # REL-026: the CLI and the MCP server as standalone executables, built and run on this architecture.
      - name: Build and smoke the standalone CLI and MCP server (Windows ${{ matrix.arch }})
        run: bun scripts/release/binaries.ts --targets win-${{ matrix.arch }} --out dist-bin --smoke --native

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-${{ matrix.arch }}
          path: |
            packages/zplc-ide/dist-electron/*-setup-unsigned.exe
            packages/zplc-ide/dist-electron/*-portable-unsigned.exe
            dist-bin/*
          retention-days: 7

  # ===========================================================================
  # Build IDE for Linux (x64 and arm64)
  # ===========================================================================
  build-linux:
    # The installers carry the two learner-board images (REL-025) and so wait for the firmware set, but not for its
    # success: when a board fails to build the installers are still built, without the images, and the notes say so.
    needs: [validate-version, verify-release-candidate, assemble-firmware]
    if: ${{ !cancelled() && needs.validate-version.result == 'success' && needs.verify-release-candidate.result == 'success' }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: |
          test -f bun.lock
          bun install --frozen-lockfile

      # IDE-025: the IDE build embeds the WebAssembly runtime (clang and wasm-ld), and fails where CI is set without them.
      - name: Install the WebAssembly toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends clang lld

      - name: Build dependencies
        run: |
          cd packages/zplc-compiler && bun run build

      - name: Build native simulator runtime
        run: |
          cmake -S firmware/lib/zplc_core -B firmware/lib/zplc_core/build -DCMAKE_BUILD_TYPE=Release
          cmake --build firmware/lib/zplc_core/build --target zplc_runtime --config Release
          mkdir -p packages/zplc-ide/dist-native
          cp firmware/lib/zplc_core/build/zplc_runtime packages/zplc-ide/dist-native/

      # REL-025: the manifest of the release firmware and the two learner-board images go inside the installer, so that
      # Studio shows them with no network. The step is skipped when the firmware set is not available.
      - name: Download the release firmware set
        id: firmware
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-firmware-set
          path: firmware-set

      - name: Stage the learner-board firmware images for the installer
        if: ${{ steps.firmware.outcome == 'success' }}
        run: bun scripts/release/firmware-images.ts stage --bundle firmware-set --out packages/zplc-ide/dist-firmware

      - name: Install Linux build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xvfb

      - name: Build Electron app (Linux ${{ matrix.arch }})
        working-directory: packages/zplc-ide
        run: |
          bun run build:assets
          bun run build
          bun run electron:compile
          bun x electron-builder --linux --${{ matrix.arch }} --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate Linux build artifacts
        working-directory: packages/zplc-ide
        run: bun run smoke:desktop-builds linux ${{ matrix.arch }}

      # REL-013: the packages that were made hold the udev rule of the boards, with the bytes that the identifier files
      # generate (read with ar and tar, rpm2cpio and cpio, from the files and not from the configuration).
      - name: Check the udev rule inside the .deb and the .rpm
        working-directory: packages/zplc-ide
        run: bun run scripts/linux-package-files.ts dist-electron

      - name: Prepare Linux Electron sandbox
        working-directory: packages/zplc-ide
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          unpacked_dirs=(dist-electron/*-unpacked)
          [ "${#unpacked_dirs[@]}" -eq 1 ] || { echo "Expected exactly one Linux unpacked app, found ${#unpacked_dirs[@]}"; exit 1; }
          unpacked="${unpacked_dirs[0]}"
          [ -d "$unpacked" ] || { echo "Unpacked app is not a directory: $unpacked"; exit 1; }
          mapfile -t sandboxes < <(find "$unpacked" -type f -name chrome-sandbox -print)
          [ "${#sandboxes[@]}" -eq 1 ] || { echo "Expected exactly one chrome-sandbox in $unpacked, found ${#sandboxes[@]}"; exit 1; }
          sandbox="${sandboxes[0]}"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          [ "$(stat -c '%U:%G:%a' "$sandbox")" = 'root:root:4755' ] || { echo "Incorrect chrome-sandbox ownership or mode"; stat -c '%U:%G:%a %n' "$sandbox"; exit 1; }

      - name: Launch packaged Linux app
        working-directory: packages/zplc-ide
        run: xvfb-run --auto-servernum bun run smoke:desktop-packaged

      # REL-034, REL-019: the unpacked application holds the example projects, the lessons and the licence notices.
      - name: Check the content of the packaged application
        working-directory: packages/zplc-ide
        env:
          ZPLC_REQUIRE_FIRMWARE: ${{ steps.firmware.outcome == 'success' && '1' || '0' }}
        run: bun run smoke:packaged-content

      # REL-026: the CLI and the MCP server as standalone executables, built and run on this architecture.
      - name: Build and smoke the standalone CLI and MCP server (Linux ${{ matrix.arch }})
        run: bun scripts/release/binaries.ts --targets linux-${{ matrix.arch }} --out dist-bin --smoke --native

      # Docker Hub tags, not actions: Debian 13, Ubuntu 24.04 and the current Fedora are the targets of REL-011.
      - name: Install and launch the .deb in clean Debian 13 and Ubuntu 24.04 containers
        working-directory: packages/zplc-ide
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist-electron/*.deb)
          [ "${#packages[@]}" -eq 1 ] || { echo "Expected exactly one .deb, found ${#packages[@]}"; exit 1; }
          failed=0
          for image in debian:13 ubuntu:24.04; do
            echo "::group::$image"
            docker run --rm --cap-add=SYS_ADMIN --shm-size=512m -e ZPLC_CONTAINER_CHECK=1 \
              -v "$PWD/scripts:/scripts:ro" -v "$PWD/dist-electron:/dist:ro" \
              "$image" bash /scripts/check-linux-package.sh "/dist/$(basename "${packages[0]}")" || { echo "FAILED on $image"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"

      - name: Install and launch the .rpm in a clean Fedora container
        working-directory: packages/zplc-ide
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist-electron/*.rpm)
          [ "${#packages[@]}" -eq 1 ] || { echo "Expected exactly one .rpm, found ${#packages[@]}"; exit 1; }
          docker run --rm --cap-add=SYS_ADMIN --shm-size=512m -e ZPLC_CONTAINER_CHECK=1 \
            -v "$PWD/scripts:/scripts:ro" -v "$PWD/dist-electron:/dist:ro" \
            fedora:latest bash /scripts/check-linux-package.sh "/dist/$(basename "${packages[0]}")"

      - name: Launch the AppImage in a clean Ubuntu 24.04 container
        working-directory: packages/zplc-ide
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist-electron/*.AppImage)
          [ "${#packages[@]}" -eq 1 ] || { echo "Expected exactly one .AppImage, found ${#packages[@]}"; exit 1; }
          docker run --rm --cap-add=SYS_ADMIN --shm-size=512m -e ZPLC_CONTAINER_CHECK=1 \
            -v "$PWD/scripts:/scripts:ro" -v "$PWD/dist-electron:/dist:ro" \
            ubuntu:24.04 bash /scripts/check-linux-package.sh "/dist/$(basename "${packages[0]}")"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: linux-${{ matrix.arch }}
          path: |
            packages/zplc-ide/dist-electron/*.AppImage
            packages/zplc-ide/dist-electron/*.deb
            packages/zplc-ide/dist-electron/*.rpm
            dist-bin/*
          retention-days: 7

  # ===========================================================================
  # The release is created here, once, and only as a draft. A person publishes it after the first-run
  # checks on a real Mac and a real Windows machine (REL-016). Nothing below ever publishes it.
  # ===========================================================================
  create-draft-release:
    needs: [validate-version, verify-release-candidate]
    if: ${{ needs.validate-version.outputs.publishing == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create or refresh the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
        run: |
          set -euo pipefail
          prerelease=false
          [[ "$RELEASE_VERSION" == *-* ]] && prerelease=true
          # The notes are generated from what the platform jobs ran, so they are written when those jobs have
          # finished (publish-release-notes); until then the draft says so.
          placeholder="Draft. The release notes are written when every platform job of the run has finished."
          if state="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            [ "$state" = true ] || { echo "Release $RELEASE_TAG is already published. The pipeline only creates drafts."; exit 1; }
            gh release edit "$RELEASE_TAG" --draft --title "ZPLC v$RELEASE_VERSION" --notes "$placeholder" --prerelease="$prerelease"
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "ZPLC v$RELEASE_VERSION" --notes "$placeholder" --prerelease="$prerelease"
          fi

  # ===========================================================================
  # The notes of the release, rendered from what the run did (REL-027): the result of each job, the files of each
  # platform bundle and the JUnit reports of CI. This job runs for a rehearsal too, so the rehearsal proves the
  # notes, and it runs when a platform failed, so the notes say which platform has no files. It writes nothing to
  # the repository: a person reads the artifact, and publish-release-notes puts it on the draft.
  # ===========================================================================
  render-release-notes:
    needs:
      - validate-version
      - verify-release-candidate
      - build-firmware
      - assemble-firmware
      - build-macos
      - build-windows
      - build-linux
      - prepare-release-evidence-firmware
      - prepare-release-evidence-macos
      - prepare-release-evidence-windows
      - prepare-release-evidence-linux
    if: ${{ always() && needs.validate-version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      - name: Download the platform bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-bundle-*
          path: bundles

      - name: Download the JUnit reports of CI
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: junit-*
          path: junit

      - name: Render the notes and merge the checksums
        env:
          NEEDS: ${{ toJSON(needs) }}
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p release-notes
          printf '%s' "$NEEDS" > release-notes/needs.json
          junit=()
          [ -f junit/junit-compiler/junit-compiler.xml ] && junit+=(--junit "compiler=typescript=junit/junit-compiler/junit-compiler.xml")
          [ -f junit/junit-ide/junit-ide.xml ] && junit+=(--junit "studio=typescript=junit/junit-ide/junit-ide.xml")
          bun scripts/release/run-results.ts \
            --needs release-notes/needs.json \
            --evidence bundles \
            "${junit[@]}" \
            --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --commit "$GITHUB_SHA" --run-url "$RUN_URL" \
            --out release-notes/run-results.json
          bun scripts/release/release-notes.ts \
            --results release-notes/run-results.json \
            --changelog CHANGELOG.md \
            --out release-notes/notes.md \
            --title-out release-notes/title.txt
          # one SHA256SUMS for every asset that a platform bundle holds (REL-017): the files of the platforms that
          # finished, merged by the script that wrote them
          mapfile -t sums < <(find bundles -name 'SHA256SUMS-*' -type f | sort)
          if [ "${#sums[@]}" -gt 0 ]; then
            node scripts/release-artifacts.mjs --merge release-notes/SHA256SUMS "${sums[@]}"
          fi

      - name: Upload the notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes${{ needs.validate-version.outputs.publishing == 'true' && '-publishable' || '-rehearsal' }}
          path: release-notes/
          retention-days: 7

  # Puts the notes, the title and the merged SHA256SUMS on the draft, which stays a draft (REL-016).
  publish-release-notes:
    needs: [validate-version, create-draft-release, render-release-notes]
    if: ${{ always() && needs.validate-version.outputs.publishing == 'true' && needs.create-draft-release.result == 'success' && needs.render-release-notes.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes-publishable
          path: release-notes/

      - name: Write the notes on the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ] || { echo "Release $RELEASE_TAG is not a draft. The pipeline only edits drafts."; exit 1; }
          gh release edit "$RELEASE_TAG" --draft --title "$(cat release-notes/title.txt)" --notes-file release-notes/notes.md
          if [ -f release-notes/SHA256SUMS ]; then
            gh release upload "$RELEASE_TAG" release-notes/SHA256SUMS --clobber
          fi

  # ===========================================================================
  # macOS: integrity evidence for every candidate, including dry-runs, then the upload to the draft.
  # Neither job waits for another platform (REL-015).
  # ===========================================================================
  prepare-release-evidence-macos:
    needs: [validate-version, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: macos-*
          path: artifacts

      - name: Bind evidence to the checked-out SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      # The bill of materials is written from the lockfile, the workspace manifests and west.yml, not from the
      # installers (REL-018). The step fails when it holds fewer packages than the lockfile lists or than the floor.
      - name: Generate the bill of materials
        run: bun scripts/release/sbom.ts --out artifacts/ZPLC-${{ needs.validate-version.outputs.version }}-macos.cdx.json

      - name: Create release integrity bundle
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: |
          node scripts/release-artifacts.mjs \
            --input-dir artifacts \
            --output-dir release \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit-sha "$RELEASE_COMMIT_SHA"
          mv release/SHA256SUMS release/SHA256SUMS-macos
          mv release/release-evidence.json release/release-evidence-macos.json

      # VF-021: the bundle is read as the files that were produced: every checksum, the evidence for this run, and the bill
      # of materials that the bundle holds.
      - name: Verify the bundle that was produced
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: bun scripts/release/verify-bundle.ts release --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --commit-sha "$RELEASE_COMMIT_SHA"

      - name: Attest installer provenance
        if: ${{ needs.validate-version.outputs.publishing == 'true' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/zplc-cli-*-mac-*
            release/zplc-mcp-*-mac-*

      - name: Attest installer SBOM
        if: ${{ needs.validate-version.outputs.publishing == 'true' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release/*.dmg
            release/*.zip
            release/zplc-cli-*-mac-*
            release/zplc-mcp-*-mac-*
          sbom-path: artifacts/ZPLC-${{ needs.validate-version.outputs.version }}-macos.cdx.json

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle-macos-${{ needs.validate-version.outputs.publishing == 'true' && 'publishable' || 'preview' }}
          path: release/
          retention-days: 7

  upload-release-macos:
    needs: [validate-version, create-draft-release, prepare-release-evidence-macos]
    if: ${{ needs.validate-version.outputs.publishing == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle-macos-publishable
          path: release/

      - name: Upload the bundle to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ] || { echo "Release $RELEASE_TAG is not a draft. The pipeline only uploads to drafts."; exit 1; }
          gh release upload "$RELEASE_TAG" release/* --clobber

  # ===========================================================================
  # Windows: integrity evidence for every candidate, including dry-runs, then the upload to the draft.
  # Neither job waits for another platform (REL-015).
  # ===========================================================================
  prepare-release-evidence-windows:
    needs: [validate-version, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: windows-*
          path: artifacts

      - name: Bind evidence to the checked-out SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      # The bill of materials is written from the lockfile, the workspace manifests and west.yml, not from the
      # installers (REL-018). The step fails when it holds fewer packages than the lockfile lists or than the floor.
      - name: Generate the bill of materials
        run: bun scripts/release/sbom.ts --out artifacts/ZPLC-${{ needs.validate-version.outputs.version }}-windows.cdx.json

      - name: Create release integrity bundle
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: |
          node scripts/release-artifacts.mjs \
            --input-dir artifacts \
            --output-dir release \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit-sha "$RELEASE_COMMIT_SHA"
          mv release/SHA256SUMS release/SHA256SUMS-windows
          mv release/release-evidence.json release/release-evidence-windows.json

      # VF-021: the bundle is read as the files that were produced: every checksum, the evidence for this run, and the bill
      # of materials that the bundle holds.
      - name: Verify the bundle that was produced
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: bun scripts/release/verify-bundle.ts release --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --commit-sha "$RELEASE_COMMIT_SHA"

      - name: Attest installer provenance
        if: ${{ needs.validate-version.outputs.publishing == 'true' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release/*.exe

      - name: Attest installer SBOM
        if: ${{ needs.validate-version.outputs.publishing == 'true' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release/*.exe
          sbom-path: artifacts/ZPLC-${{ needs.validate-version.outputs.version }}-windows.cdx.json

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle-windows-${{ needs.validate-version.outputs.publishing == 'true' && 'publishable' || 'preview' }}
          path: release/
          retention-days: 7

  upload-release-windows:
    needs: [validate-version, create-draft-release, prepare-release-evidence-windows]
    if: ${{ needs.validate-version.outputs.publishing == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle-windows-publishable
          path: release/

      - name: Upload the bundle to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ] || { echo "Release $RELEASE_TAG is not a draft. The pipeline only uploads to drafts."; exit 1; }
          gh release upload "$RELEASE_TAG" release/* --clobber

  # ===========================================================================
  # Linux: integrity evidence for every candidate, including dry-runs, then the upload to the draft.
  # Neither job waits for another platform (REL-015).
  # ===========================================================================
  prepare-release-evidence-linux:
    needs: [validate-version, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: linux-*
          path: artifacts

      - name: Bind evidence to the checked-out SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      # The bill of materials is written from the lockfile, the workspace manifests and west.yml, not from the
      # installers (REL-018). The step fails when it holds fewer packages than the lockfile lists or than the floor.
      - name: Generate the bill of materials
        run: bun scripts/release/sbom.ts --out artifacts/ZPLC-${{ needs.validate-version.outputs.version }}-linux.cdx.json

      - name: Create release integrity bundle
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: |
          node scripts/release-artifacts.mjs \
            --input-dir artifacts \
            --output-dir release \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit-sha "$RELEASE_COMMIT_SHA"
          mv release/SHA256SUMS release/SHA256SUMS-linux
          mv release/release-evidence.json release/release-evidence-linux.json

      # VF-021: the bundle is read as the files that were produced: every checksum, the evidence for this run, and the bill
      # of materials that the bundle holds.
      - name: Verify the bundle that was produced
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: bun scripts/release/verify-bundle.ts release --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --commit-sha "$RELEASE_COMMIT_SHA"

      - name: Attest installer provenance
        if: ${{ needs.validate-version.outputs.publishing == 'true' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/zplc-cli-*-linux-*
            release/zplc-mcp-*-linux-*

      - name: Attest installer SBOM
        if: ${{ needs.validate-version.outputs.publishing == 'true' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release/*.AppImage
            release/*.deb
            release/*.rpm
            release/zplc-cli-*-linux-*
            release/zplc-mcp-*-linux-*
          sbom-path: artifacts/ZPLC-${{ needs.validate-version.outputs.version }}-linux.cdx.json

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle-linux-${{ needs.validate-version.outputs.publishing == 'true' && 'publishable' || 'preview' }}
          path: release/
          retention-days: 7

  upload-release-linux:
    needs: [validate-version, create-draft-release, prepare-release-evidence-linux]
    if: ${{ needs.validate-version.outputs.publishing == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle-linux-publishable
          path: release/

      - name: Upload the bundle to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ] || { echo "Release $RELEASE_TAG is not a draft. The pipeline only uploads to drafts."; exit 1; }
          gh release upload "$RELEASE_TAG" release/* --clobber

  # ===========================================================================
  # Firmware: integrity evidence for every candidate, including dry-runs, then the upload to the draft. The images are
  # covered by SHA256SUMS and by the build provenance attestation like every other asset (REL-017). The bundle holds
  # the images of every board and the manifest that lists them, or this job fails and the draft has no firmware.
  # ===========================================================================
  prepare-release-evidence-firmware:
    needs: [validate-version, assemble-firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          ref: ${{ github.sha }}

      - name: Download the release firmware set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-firmware-set
          path: artifacts

      - name: Bind evidence to the checked-out SHA
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"

      - name: Setup Bun
        uses: oven-sh/setup-bun@f4d14e03ff726c06358e5557344e1da148b56cf7 # v1.2.2
        with:
          bun-version: 1.3.14

      # The manifest must be what its images are: every checksum and size, before anything is attested.
      - name: Check the firmware set against its manifest
        run: |
          set -euo pipefail
          bun scripts/release/firmware-images.ts stage --bundle artifacts --out "${RUNNER_TEMP}/firmware-learner-check"

      - name: Generate the bill of materials
        run: bun scripts/release/sbom.ts --out artifacts/ZPLC-${{ needs.validate-version.outputs.version }}-firmware.cdx.json

      - name: Create release integrity bundle
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: |
          node scripts/release-artifacts.mjs \
            --input-dir artifacts \
            --output-dir release \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --commit-sha "$RELEASE_COMMIT_SHA"
          mv release/SHA256SUMS release/SHA256SUMS-firmware
          mv release/release-evidence.json release/release-evidence-firmware.json

      - name: Verify the bundle that was produced
        env:
          RELEASE_VERSION: ${{ needs.validate-version.outputs.version }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
          RELEASE_COMMIT_SHA: ${{ github.sha }}
        run: bun scripts/release/verify-bundle.ts release --version "$RELEASE_VERSION" --tag "$RELEASE_TAG" --commit-sha "$RELEASE_COMMIT_SHA"

      - name: Attest firmware provenance
        if: ${{ needs.validate-version.outputs.publishing == 'true' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release/zplc-runtime-*

      - name: Attest firmware SBOM
        if: ${{ needs.validate-version.outputs.publishing == 'true' }}
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            release/zplc-runtime-*
          sbom-path: artifacts/ZPLC-${{ needs.validate-version.outputs.version }}-firmware.cdx.json

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-bundle-firmware-${{ needs.validate-version.outputs.publishing == 'true' && 'publishable' || 'preview' }}
          path: release/
          retention-days: 7

  upload-release-firmware:
    needs: [validate-version, create-draft-release, prepare-release-evidence-firmware]
    if: ${{ needs.validate-version.outputs.publishing == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-bundle-firmware-publishable
          path: release/

      - name: Upload the bundle to the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-version.outputs.tag }}
        run: |
          set -euo pipefail
          [ "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true ] || { echo "Release $RELEASE_TAG is not a draft. The pipeline only uploads to drafts."; exit 1; }
          gh release upload "$RELEASE_TAG" release/* --clobber
