<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 304" width="760" height="304" role="img" aria-labelledby="wiring-rpi-pico-rp2040-title wiring-rpi-pico-rp2040-desc" font-family="sans-serif" fill="#111111" stroke="#222222" stroke-width="1.5">
<title id="wiring-rpi-pico-rp2040-title">Wiring on Raspberry Pi Pico (RP2040)</title>
<desc id="wiring-rpi-pico-rp2040-desc">Pulse input: push button between GP15 (header pin 20, DI0) and GND (GND · pin 38); the internal pull-up of the board reads it. Reset: push button between GP14 (header pin 19, DI1) and GND (GND · pin 38); the internal pull-up of the board reads it. Count reached: green LED with a 330 Ω resistor in series, from GP0 (header pin 1, DO0) to GND (GND · pin 38).</desc>
