<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" width="760" height="496" role="img" aria-labelledby="wiring-esp32-s3-devkitc-title wiring-esp32-s3-devkitc-desc" font-family="sans-serif" fill="#111111" stroke="#222222" stroke-width="1.5">
<title id="wiring-esp32-s3-devkitc-title">Cableado en ESP32-S3-DevKitC-1 (N8R8)</title>
<desc id="wiring-esp32-s3-devkitc-desc">Arranque de la bomba A: pulsador entre GPIO0 (BOOT) (header J3 and BOOT button, DI0) y GND (GND · J1-22); lo lee la resistencia de pull-up interna de la placa. Parada de la bomba A: pulsador entre GPIO18 (header J1, DI1) y GND (GND · J1-22); lo lee la resistencia de pull-up interna de la placa. Arranque de la bomba B: pulsador entre GPIO8 (header J1, DI2) y GND (GND · J1-22); lo lee la resistencia de pull-up interna de la placa. Parada de la bomba B: cable puente desde GPIO9 (header J1, DI3) hasta GND (GND · J1-22); conectado significa activado. Bomba A en marcha: LED verde con una resistencia de 330 Ω en serie, desde GPIO38 (header J3, DO0) hasta GND (GND · J1-22). Bomba B en marcha: LED amarillo con una resistencia de 330 Ω en serie, desde GPIO15 (header J1, DO1) hasta GND (GND · J1-22).</desc>
