<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" width="760" height="240" role="img" aria-labelledby="wiring-esp32-s3-devkitc-title wiring-esp32-s3-devkitc-desc" font-family="sans-serif" fill="#111111" stroke="#222222" stroke-width="1.5">
<title id="wiring-esp32-s3-devkitc-title">Wiring on ESP32-S3-DevKitC-1 (N8R8)</title>
<desc id="wiring-esp32-s3-devkitc-desc">Enable: jumper wire from GPIO5 (header J1 pin 5, DI0) to GND (GND · J1-22); plugged in means on. Lamp: red LED with a 330 Ω resistor in series, from GPIO15 (header J1 pin 8, DO0) to GND (GND · J1-22).</desc>
<rect width="760" height="240" fill="#ffffff" stroke="none"/>
<text stroke="none" x="16" y="30" font-size="15" font-weight="bold">Wiring on ESP32-S3-DevKitC-1 (N8R8)</text>
<rect x="8" y="48" width="256" height="144" rx="8" fill="#eef3f8"/>
<rect x="20" y="66" width="232" height="44" rx="4" fill="#ffffff"/>
<text stroke="none" x="30" y="84" font-size="13" font-weight="bold">GPIO5</text>
<text stroke="none" x="30" y="102" font-size="11">header J1 pin 5 · DI0</text>
<text stroke="none" x="440" y="80" font-size="13" font-weight="bold">Enable</text>
<polyline points="264,88 712,88" fill="none" stroke-dasharray="6 4"/>
<text stroke="none" x="357" y="106" text-anchor="middle" font-size="11">jumper wire to GND</text>
<rect x="20" y="130" width="232" height="44" rx="4" fill="#ffffff"/>
<text stroke="none" x="30" y="148" font-size="13" font-weight="bold">GPIO15</text>
<text stroke="none" x="30" y="166" font-size="11">header J1 pin 8 · DO0</text>
<text stroke="none" x="440" y="144" font-size="13" font-weight="bold">Lamp</text>
