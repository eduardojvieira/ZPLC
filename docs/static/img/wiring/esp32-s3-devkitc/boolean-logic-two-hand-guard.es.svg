<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 496" width="760" height="496" role="img" aria-labelledby="wiring-esp32-s3-devkitc-title wiring-esp32-s3-devkitc-desc" font-family="sans-serif" fill="#111111" stroke="#222222" stroke-width="1.5">
<title id="wiring-esp32-s3-devkitc-title">Cableado en ESP32-S3-DevKitC-1 (N8R8)</title>
<desc id="wiring-esp32-s3-devkitc-desc">Mano izquierda: pulsador entre GPIO5 (pin 5 del conector J1, DI0) y GND (GND · J1-22); la placa lo lee con su resistencia de pull-up interna. Mano derecha: pulsador entre GPIO6 (pin 6 del conector J1, DI1) y GND (GND · J1-22); la placa lo lee con su resistencia de pull-up interna. Protección cerrada: cable puente desde GPIO7 (pin 7 del conector J1, DI2) hasta GND (GND · J1-22); conectado significa activado. Habilitación de la prensa: LED verde con una resistencia de 330 Ω en serie, desde GPIO15 (pin 8 del conector J1, DO0) hasta GND (GND · J1-22). Lámpara de la protección: LED amarillo con una resistencia de 330 Ω en serie, desde GPIO16 (pin 9 del conector J1, DO1) hasta GND (GND · J1-22). Advertencia de una sola mano: LED rojo con una resistencia de 330 Ω en serie, desde GPIO17 (pin 10 del conector J1, DO2) hasta GND (GND · J1-22).</desc>
