<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 368" width="760" height="368" role="img" aria-labelledby="wiring-esp32-s3-devkitc-title wiring-esp32-s3-devkitc-desc" font-family="sans-serif" fill="#111111" stroke="#222222" stroke-width="1.5">
<title id="wiring-esp32-s3-devkitc-title">Wiring on ESP32-S3-DevKitC-1 (N8R8)</title>
<desc id="wiring-esp32-s3-devkitc-desc">Button: push button between GPIO0 (BOOT) (header J3 and BOOT button, DI0) and GND (GND · J1-22); the internal pull-up of the board reads it. Sensor: push button between GPIO18 (header J1, DI1) and GND (GND · J1-22); the internal pull-up of the board reads it. Light: yellow LED with a 330 Ω resistor in series, from GPIO38 (header J3, DO0) to GND (GND · J1-22). Confirmed: green LED with a 330 Ω resistor in series, from GPIO15 (header J1, DO1) to GND (GND · J1-22).</desc>
